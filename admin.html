<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Seva Care</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5ff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #4a90e2;
        }

        .card {
            background: white;
            width: 90%;
            margin: 15px auto;
            padding: 20px;
            text-align: left;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            background: #d9534f;
            color: white;
            padding: 7px 12px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>🛠️ Admin Panel - Seva Care</h1>

<h2>📌 All Users</h2>
<div id="usersList">Loading users...</div>

<h2>📌 All Bookings</h2>
<div id="bookingsList">Loading bookings...</div>

<h2>📌 Worker Reviews</h2>
<div id="reviewsList">Loading reviews...</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="auth.js"></script>

<script>
// Admin only allowed (your admin email)
const ADMIN_EMAIL = "Sachiny4561@gmail.com"; // change if needed

auth.onAuthStateChanged(async user => {
    if (!user || user.email !== ADMIN_EMAIL) {
        alert("Admin access only!");
        window.location.href = "login.html";
        return;
    }

    loadUsers();
    loadBookings();
    loadReviews();
});


// -------------------------------
// Load All Users
// -------------------------------
function loadUsers() {
    db.collection("users").onSnapshot(snapshot => {
        const usersDiv = document.getElementById("usersList");
        usersDiv.innerHTML = "";

        snapshot.forEach(doc => {
            const u = doc.data();

            let rating = "No Ratings";
            if (u.ratingCount > 0) {
                rating = (u.ratingTotal / u.ratingCount).toFixed(1) + " ⭐";
            }

            usersDiv.innerHTML += `
                <div class="card">
                    <b>Email:</b> ${u.email}<br>
                    <b>Role:</b> ${u.role}<br>
                    <b>Earnings:</b> ₹${u.earnings || 0}<br>
                    <b>Rating:</b> ${rating}<br>
                    <button onclick="deleteUser('${doc.id}')">Delete User</button>
                </div>
            `;
        });
    });
}


// Delete user
async function deleteUser(uid) {
    if (!confirm("Are you sure you want to delete this user?")) return;
    await db.collection("users").doc(uid).delete();
    alert("User deleted!");
}


// -------------------------------
// Load All Bookings
// -------------------------------
function loadBookings() {
    db.collection("bookings")
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
            const bookingsDiv = document.getElementById("bookingsList");
            bookingsDiv.innerHTML = "";

            snapshot.forEach(doc => {
                const b = doc.data();

                bookingsDiv.innerHTML += `
                    <div class="card">
                        <b>Service:</b> ${b.service}<br>
                        <b>Price:</b> ₹${b.price}<br>
                        <b>Status:</b> ${b.status}<br>
                        <b>Customer:</b> ${b.userEmail}<br>
                        <b>Worker:</b> ${b.assignedWorkerId || "Not Assigned"}<br>
                        <b>Date:</b> ${new Date(b.time).toLocaleString()}<br>

                        <button onclick="deleteBooking('${doc.id}')">Delete Booking</button>
                    </div>
                `;
            });
        });
}


// Delete booking
async function deleteBooking(id) {
    if (!confirm("Delete this booking?")) return;
    await db.collection("bookings").doc(id).delete();
    alert("Booking deleted!");
}


// -------------------------------
// Load Reviews
// -------------------------------
function loadReviews() {
    db.collection("reviews")
        .orderBy("timestamp", "desc")
        .onSnapshot(snapshot => {
            const reviewsDiv = document.getElementById("reviewsList");
            reviewsDiv.innerHTML = "";

            snapshot.forEach(doc => {
                const r = doc.data();

                reviewsDiv.innerHTML += `
                    <div class="card">
                        <b>Booking ID:</b> ${r.bookingId}<br>
                        <b>Worker ID:</b> ${r.workerId}<br>
                        <b>Rating:</b> ${r.rating} ⭐<br>
                        <b>Review:</b> ${r.reviewText}<br>
                        <b>Date:</b> ${new Date(r.timestamp.toDate()).toLocaleString()}<br>
                    </div>
                `;
            });
        });
}

</script>

</body>
</html>
