<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Select Role - Seva Care</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f1f5ff;
            padding: 20px;
        }

        h1 { color: #4a90e2; }

        .card {
            background: white;
            padding: 20px;
            width: 80%;
            margin: 15px auto;
            border-radius: 12px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.15);
        }

        button {
            background: #4a90e2;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            margin-top: 10px;
            width: 80%;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Seva Care</h1>
    <p>Select how you want to use the app today</p>

    <div class="card">
        <h2>I Need a Service</h2>
        <p>Book massage, cleaning, plumber, electrician, etc.</p>
        <button onclick="location.href='customer_home.html'">Continue as Customer</button>
    </div>

    <div class="card">
        <h2>I Want to Work</h2>
        <p>Earn money by providing services.</p>
        <button onclick="location.href='worker_home.html'">Continue as Worker</button>
    </div>

</body>
  </html>
