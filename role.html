<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose Role - Seva</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body { margin:0; font-family: Arial; background-color:#e9f6e9; }
.navbar { background:#166d33; padding:12px; display:flex; justify-content:space-around; color:white; font-weight:bold; }
.navbar div { cursor:pointer; text-align:center; }
.banner { width:90%; margin:20px auto; background:linear-gradient(135deg,#0B6C36,#0F8A34); padding:25px; border-radius:25px; color:white; text-align:center; }
.box { width:90%; margin:20px auto; background:white; padding:25px; border-radius:20px; text-align:center; }
button { width:90%; padding:15px; margin:12px 0; font-size:17px; color:white; border:none; border-radius:12px; cursor:pointer; }
.cusBtn { background:#166d33; }
.workBtn { background:#0b6c39; }
.contactBtn { background:#f2a104; }
.shareBtn { background:#0d47a1; }
.footer { background:#166d33; padding:12px; margin-top:25px; color:white; text-align:center; }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div onclick="go('role.html')">🏡<br>Home</div>
    <div onclick="go('need.html')">📝<br>Need</div>
    <div onclick="go('help.html')">❓<br>Help</div>
    <div onclick="go('profile.html')">👤<br>Profile</div>
    <div onclick="go('contact.html')">📞<br>Contact</div>
    <div onclick="go('about.html')">ℹ️<br>About</div>
</div>

<!-- Banner -->
<div class="banner">
    <h2>Do Work and Earn Money 💰💫</h2>
    <p>Flexible hours • Trusted customers • Fast payouts</p>
</div>

<!-- Role Selection -->
<div class="box">
<h2>Select Your Role</h2>

<button class="cusBtn" onclick="saveRole('customer')">Continue as Customer</button>
<button class="workBtn" onclick="saveRole('worker')">Continue as Worker</button>

<button class="contactBtn" onclick="go('contact.html')">🛠 Contact Support</button>
<button class="shareBtn" onclick="share()">🔗 Share App</button>

<p onclick="logout()" style="color:#166d33; cursor:pointer; margin-top:10px;">Logout</p>
</div>

<div class="footer">© 2026 Seva Care • Helping People Daily ❤️</div>

<script>
// Firebase Config
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.appspot.com",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);

// Page redirect
function go(page){
    window.location.href = page;   // FIXED (NO “Seva/”)
}

// Save role
function saveRole(roleName){
    var user = firebase.auth().currentUser;
    if(!user){
        alert("Please login first.");
        go("login.html");
        return;
    }

    firebase.database().ref("users/" + user.uid).update({ role: roleName });

    if(roleName === "customer") go("customer_dashboard.html");
    else go("worker_dashboard.html");
}

// Logout
function logout(){
    firebase.auth().signOut().then(()=> go("login.html"));
}

// Force login check
firebase.auth().onAuthStateChanged(user=>{
    if(!user) go("login.html");
});

// Share
function share(){
    if(navigator.share){
        navigator.share({
            title:"Seva Care App",
            text:"Join Seva Care – Find help or earn income!",
            url:"https://sachin221997.github.io/Seva/login.html"
        });
    } else {
        alert("Sharing not supported.");
    }
}
</script>

</body>
                                                </html>
