<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose Role - Seva</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{ margin:0; font-family:Arial,sans-serif; background:#e9f6e9; }
.navbar{ background:#166d33; padding:12px; display:flex; justify-content:space-around; color:white; font-weight:bold; text-align:center; }
.navbar div{ cursor:pointer; }

.banner{
    width:90%; margin:20px auto; padding:25px;
    background:linear-gradient(135deg,#0B6C36,#0F8A34); color:white;
    text-align:center; border-radius:25px;
    box-shadow:0 0 12px rgba(0,0,0,0.15);
}
.banner h2{ margin-bottom:8px; }
.banner p{ font-size:15px; opacity:.9; }

.box{
    width:90%; margin:20px auto; padding:25px; text-align:center;
    background:white; border-radius:20px; 
    box-shadow:0 0 8px rgba(0,0,0,.1);
}

button{
    width:90%; padding:15px; margin:12px 0;
    color:white; font-size:17px; border:none; border-radius:12px; cursor:pointer;
}
.cusBtn{ background:#166d33; }
.workBtn{ background:#0b63c9; }
.contactBtn{ background:#f2a104; }

.social-box{ text-align:center; margin-top:20px; }
.social-box img{ width:45px; margin:10px; cursor:pointer; }

.footer{ background:#166d33; color:white; padding:12px; text-align:center; margin-top:25px; }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div onclick="go('role.html')">🏠<br>Home</div>
    <div onclick="go('need.html')">📌<br>Need</div>
    <div onclick="go('help.html')">🛠️<br>Help</div>
    <div onclick="go('profile.html')">👤<br>Profile</div>
    <div onclick="go('contact.html')">📞<br>Contact</div>
    <div onclick="go('about.html')">ℹ️<br>About</div>
</div>

<!-- Banner -->
<div class="banner">
    <h2>Do Work and Earn Money 💰</h2>
    <p>Flexible hours • Trusted customers • Fast payouts</p>
</div>

<!-- Role Box -->
<div class="box">
    <h2>Select Your Role</h2>

    <button class="cusBtn" onclick="saveRole('customer')">Continue as Customer</button>
    <button class="workBtn" onclick="saveRole('worker')">Continue as Worker</button>

    <button class="contactBtn" onclick="go('contact.html')">📞 Contact Support</button>

    <p onclick="logout()" style="color:#166d33;cursor:pointer;margin-top:10px;">Logout</p>

    <div class="social-box">

        <img src="https://cdn-icons-png.flaticon.com/512/1384/1384095.png" onclick="openLink('https://instagram.com/')">
        <img src="https://cdn-icons-png.flaticon.com/128/3670/3670051.png" onclick="openLink('https://wa.me/91XXXXXXXXXX')">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" onclick="openLink('https://facebook.com/')">

        <!-- ⭐ NEW SHARE ICON ⭐ -->
        <img src="https://cdn-icons-png.flaticon.com/512/2958/2958791.png" onclick="shareApp()">

    </div>
</div>

<div class="footer">© 2025 Seva • Helping People Daily ❤️</div>

<script>
// Firebase Config
var firebaseConfig={
apiKey:"AIzaSyBOcsJLpaMSVcFo-XlGUEftIcoyxRFzik",
authDomain:"seva-6f191.firebaseapp.com",
projectId:"seva-6f191",
storageBucket:"seva-6f191.firebasestorage.app",
messagingSenderId:"826093348416",
appId:"1:826093348416:web:19fe4d3b9b7cba09b21a5",
measurementId:"G-7H8ZSRSCP0"
};
firebase.initializeApp(firebaseConfig);

// Redirect
function go(p){ window.location.href=p; }

// Links
function openLink(url){ window.open(url,"_blank"); }

// SAVE ROLE
function saveRole(role){
 let user=firebase.auth().currentUser;
 if(!user){
     alert("Please login first.");
     go("login.html");
     return;
 }

 firebase.database().ref("users/"+user.uid).update({ role:role });

 if(role==="customer") go("customer_dashboard.html");
 else go("worker_dashboard.html");
}

// LOGOUT
function logout(){
 firebase.auth().signOut().then(()=>go("login.html"));
}

// ⭐ SHARE FUNCTION ⭐
function shareApp(){
 const data={
   title:"Seva — Helping People Daily",
   text:"Join Seva App! Find work or hire workers easily.",
   url:"https://in221997.github.io"
 };

 if(navigator.share){
   navigator.share(data);
 } else {
   alert("Sharing not supported!");
 }
}

// LOGIN CHECK — MUST BE LAST
firebase.auth().onAuthStateChanged(user=>{
    if(!user) window.location.href="login.html";
});
</script>

</body>
</html>
