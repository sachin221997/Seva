<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Role - Seva App</title>

<style>
body {
    margin: 0;
    font-family: Inter, Arial;
    background: #e8f5e9;
}

.header {
    background: #1b5e20;
    padding: 25px;
    color: white;
    font-size: 30px;
    text-align: center;
    font-weight: 700;
}

.box {
    width: 90%;
    max-width: 380px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 14px;
    box-shadow: 0px 4px 18px rgba(0,0,0,0.15);
    text-align: center;
}

.box h2 {
    color: #1b5e20;
    margin-bottom: 20px;
}

.btn {
    width: 95%;
    padding: 14px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    margin: 12px 0;
}

.btn-worker {
    background: #1565c0;
}

.logout {
    color: #2e7d32;
    margin-top: 15px;
    display: block;
    text-decoration: none;
}

.footer {
    margin-top: 40px;
    text-align: center;
    padding: 20px;
    background: #1b5e20;
    color: white;
}
</style>
</head>

<body>

<div class="header">❤️ Seva App</div>

<div class="box">
    <h2>Select Your Role</h2>

    <button class="btn" onclick="setCustomer()">Continue as Customer</button>
    <button class="btn btn-worker" onclick="setWorker()">Continue as Worker</button>

    <a href="login.html" class="logout">Logout</a>
</div>

<div class="footer">© 2025 Seva – Helping People Daily ❤️</div>


<!-- Firebase v8 SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// Firebase Config
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db   = firebase.firestore();


// CUSTOMER ROLE
function setCustomer() {
    let user = auth.currentUser;
    if (!user) return alert("Please login first!");

    db.collection("users").doc(user.uid).update({
        role: "customer"
    });

    window.location.href = "customer_home.html";
}


// WORKER ROLE
function setWorker() {
    let user = auth.currentUser;
    if (!user) return alert("Please login first!");

    db.collection("users").doc(user.uid).update({
        role: "worker",
        available: true
    });

    window.location.href = "worker_home.html";
}
</script>

</body>
</html>
