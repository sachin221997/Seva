<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose Role - Seva</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #e9f6e9;
    }

    .navbar {
        background-color: #166d33;
        padding: 12px;
        display: flex;
        justify-content: space-around;
        color: white;
        font-weight: bold;
        text-align: center;
    }

    .navbar div { cursor: pointer; }

    .box {
        width: 90%;
        margin: 20px auto;
        background: white;
        padding: 25px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0px 0px 8px rgba(0,0,0,0.1);
    }

    h2 {
        color: #166d33;
        margin-bottom: 20px;
    }

    button {
        width: 90%;
        padding: 15px;
        font-size: 17px;
        color: white;
        border: none;
        border-radius: 10px;
        margin: 10px 0;
        cursor: pointer;
    }

    .cusBtn { background-color: #166d33; }
    .workBtn { background-color: #0b63c9; }

    .footer {
        background-color: #166d33;
        padding: 12px;
        margin-top: 25px;
        color: white;
        text-align: center;
    }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div onclick="go('role.html')">🏠<br>Home</div>
    <div onclick="go('need.html')">📌<br>Need</div>
    <div onclick="go('help.html')">🔧<br>Help</div>
    <div onclick="go('profile.html')">👤<br>Profile</div>
    <div onclick="go('search.html')">🔍<br>Search</div>
    <div onclick="go('about.html')">ℹ️<br>About</div>
</div>

<div class="box">
    <h2>Select Your Role</h2>

    <button class="cusBtn" onclick="saveRole('customer')">Continue as Customer</button>
    <button class="workBtn" onclick="saveRole('worker')">Continue as Worker</button>

    <p onclick="logout()" style="color:#166d33; cursor:pointer;">Logout</p>
</div>

<div class="footer">© 2025 Seva • Helping People Daily ❤️</div>

<script>
// Firebase Config
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);

// Redirect function
function go(page) {
    window.location.href = page;
}

// SAVE ROLE + REDIRECT
function saveRole(roleName) {
    var user = firebase.auth().currentUser;

    if (!user) {
        alert("Please login first.");
        go("login.html");
        return;
    }

    firebase.database().ref("users/" + user.uid).update({
        role: roleName
    });

    // IMPORTANT — Correct redirects
    if (roleName === "customer") {
        go("customer_dashboard.html");
    } else {
        go("worker_dashboard.html");
    }
}

// LOGOUT
function logout() {
    firebase.auth().signOut().then(() => go("login.html"));
}

// LOGIN CHECK
firebase.auth().onAuthStateChanged(user => {
    if (!user) go("login.html");
});
</script>

</body>
</html>
