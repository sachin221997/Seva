<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Role - Seva Care</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f1f5ff;
            padding: 20px;
        }
        h1 { color: #4a90e2; }

        .card {
            background: white;
            width: 80%;
            margin: 15px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        button {
            background: #4a90e2;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            width: 80%;
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Seva Care</h1>
    <p>Select how you want to use the app today</p>

    <div class="card">
        <h2>I Need a Service</h2>
        <p>Book massage, cleaning, plumber, electrician, etc.</p>
        <button onclick="setCustomer()">Continue as Customer</button>
    </div>

    <div class="card">
        <h2>I Want to Work</h2>
        <p>Earn money by providing services.</p>
        <button onclick="setWorker()">Continue as Worker</button>
    </div>


    <!-- Firebase v10 SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <!-- Your JS -->
    <script src="auth.js"></script>

</body>
</html>
