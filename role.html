<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Role - Seva</title>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #e9f6e9;
}

.navbar {
    background-color: #166d33;
    padding: 12px;
    display: flex;
    justify-content: space-around;
    color: white;
    font-weight: bold;
    text-align: center;
}

.navbar div { cursor: pointer; }

.banner {
    width: 90%;
    margin: 20px auto;
    background: linear-gradient(135deg, #0B6C36, #0F8A34);
    padding: 25px;
    border-radius: 25px;
    color: white;
    text-align: center;
    box-shadow: 0px 0px 12px rgba(0,0,0,0.15);
}

.box {
    width: 90%;
    margin: 20px auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0px 0px 8px rgba(0,0,0,0.1);
}

button {
    width: 90%;
    padding: 15px;
    font-size: 17px;
    color: white;
    border: none;
    border-radius: 12px;
    margin: 12px 0;
    cursor: pointer;
}

.cusBtn { background-color: #166d33; }
.workBtn { background-color: #0b63c9; }
.contactBtn { background-color: #F2A104; }
.shareBtn { background-color: #0C9F5A; }

.social-box img {
    width: 45px;
    margin: 0 10px;
    cursor: pointer;
}

.footer {
    background-color: #166d33;
    padding: 12px;
    margin-top: 25px;
    color: white;
    text-align: center;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div onclick="go('role.html')">🏠<br>Home</div>
    <div onclick="go('need.html')">📌<br>Need</div>
    <div onclick="go('help.html')">🛠️<br>Help</div>
    <div onclick="go('profile.html')">👤<br>Profile</div>
    <div onclick="go('contact.html')">📞<br>Contact</div>
    <div onclick="go('about.html')">ℹ️<br>About</div>
</div>

<!-- Banner -->
<div class="banner">
    <h2>Do Work and Earn Money 💰</h2>
    <p>Flexible hours • Trusted customers • Fast payouts</p>
</div>

<!-- Role Box -->
<div class="box">
    <h2>Select Your Role</h2>

    <button class="cusBtn" onclick="saveRole('customer')">Continue as Customer</button>
    <button class="workBtn" onclick="saveRole('worker')">Continue as Worker</button>

    <button class="contactBtn" onclick="go('contact.html')">📞 Contact Support</button>

    <button class="shareBtn" onclick="shareApp()">🔗 Share This App</button>

    <p onclick="logout()" style="color:#166d33; cursor:pointer; margin-top:10px;">Logout</p>
</div>

<!-- Social Icons -->
<div class="box" style="text-align:center;">
    <div class="social-box">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" onclick="openLink('https://instagram.com')">
        <img src="https://cdn-icons-png.flaticon.com/128/3670/3670051.png" onclick="openLink('https://wa.me/91XXXXXXXXXX')">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" onclick="openLink('https://facebook.com')">
    </div>
</div>

<div class="footer">© 2025 Seva • Helping People Daily ❤️</div>

<script>
// Firebase Config
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVCFo-XI6UFEItcoxyRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.appspot.com",
    messagingSenderId: "826093384416",
    appId: "1:826093384416:web:19fe4e43b9b7cba09b21a5",
    measurementId: "G-78H3ZSRPCD"
};
firebase.initializeApp(firebaseConfig);

// Redirect
function go(page){ window.location.href = page; }

// Open social links
function openLink(url){ window.open(url, "_blank"); }

// SHARE BUTTON FUNCTION
function shareApp() {
    if (navigator.share) {
        navigator.share({
            title: "Seva App",
            text: "Try this amazing app Seva Care!",
            url: "https://sachin221997.github.io/Seva/"
        });
    } else {
        alert("Sharing not supported on this device.");
    }
}

// SAVE ROLE FUNCTION
function saveRole(roleName){
    var user = firebase.auth().currentUser;
    if(!user){
        alert("Please login first.");
        go("login.html");
        return;
    }

    firebase.database().ref("users/" + user.uid).update({ role: roleName });

    if(roleName === "customer"){
        go("customer_dashboard.html");
    } else {
        go("worker_dashboard.html");
    }
}

// LOGOUT
function logout(){
    firebase.auth().signOut().then(()=> go("login.html"));
}

// LOGIN CHECK (fixed)
firebase.auth().onAuthStateChanged(function(user){
    if(user){
        console.log("User logged in");
    } else {
        console.log("Redirecting to login...");
        setTimeout(()=>{ go("login.html"); }, 500);
    }
});
</script>

</body>
    </html>
