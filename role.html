<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #e9f6e9;
    }

    .navbar {
        background-color: #166d33;
        padding: 12px;
        display: flex;
        justify-content: space-around;
        color: white;
        font-weight: bold;
        text-align: center;
    }

    .navbar div { cursor: pointer; }

    /* Banner */
    .banner {
        width: 90%;
        background: linear-gradient(135deg, #0b8636, #18a14f);
        margin: 20px auto;
        padding: 30px 20px;
        border-radius: 20px;
        text-align: center;
        color: white;
        font-size: 20px;
        font-weight: bold;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.15);
    }
    .banner small {
        display: block;
        margin-top: 10px;
        font-size: 14px;
        opacity: 0.9;
        font-weight: normal;
    }

    .box {
        width: 90%;
        margin: 20px auto;
        background: white;
        padding: 25px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0px 0px 8px rgba(0,0,0,0.1);
    }

    h2 {
        color: #166d33;
        margin-bottom: 20px;
    }

    button {
        width: 90%;
        padding: 15px;
        font-size: 17px;
        color: white;
        border: none;
        border-radius: 10px;
        margin: 10px 0;
        cursor: pointer;
    }

    .cusBtn { background-color: #166d33; }
    .workBtn { background-color: #0b63c9; }
    .contactBtn { background-color: #f39c12; }

    .social-icons {
        margin-top: 30px;
        text-align: center;
    }
    .social-icons img {
        width: 40px;
        margin: 0 10px;
        cursor: pointer;
    }

    .footer {
        background-color: #166d33;
        padding: 12px;
        margin-top: 25px;
        color: white;
        text-align: center;
    }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div onclick="go('role.html')">🏠<br>Home</div>
    <div onclick="go('need.html')">📌<br>Need</div>
    <div onclick="go('help.html')">🔧<br>Help</div>
    <div onclick="go('profile.html')">👤<br>Profile</div>
    <div onclick="go('contact.html')">📞<br>Contact</div>
    <div onclick="go('about.html')">ℹ️<br>About</div>
</div>

<!-- BANNER -->
<div class="banner">
    Do Work and Earn Money 💰
    <small>Flexible hours • Trusted customers • Fast payouts</small>
</div>

<div class="box">
    <h2>Select Your Role</h2>

    <button class="cusBtn" onclick="saveRole('customer')">Continue as Customer</button>
    <button class="workBtn" onclick="saveRole('worker')">Continue as Worker</button>

    <!-- Contact Button Inside Box -->
    <button class="contactBtn" onclick="contactSupport()">📞 Contact Support</button>

    <p onclick="logout()" style="color:#166d33; cursor:pointer;">Logout</p>

    <!-- SOCIAL ICONS -->
    <div class="social-icons">
        <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" title="Facebook">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" title="Instagram">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" title="WhatsApp">
    </div>
</div>

<div class="footer">© 2025 Seva • Helping People Daily ❤️</div>

<script>
// Firebase Config
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);

// Redirect
function go(page){ window.location.href = page; }

// Save Role
function saveRole(roleName){
    var user = firebase.auth().currentUser;

    if(!user){
        alert("Please login first.");
        go("login.html");
        return;
    }

    firebase.database().ref("users/" + user.uid).update({ role: roleName });

    if(roleName === "customer"){
        go("customer_dashboard.html");
    } else {
        go("worker_dashboard.html");
    }
}

// Contact Support Function
function contactSupport(){
    window.location.href = "mailto:support@sevaapp.com?subject=Need Help&body=Hi Support, I need help with...";
}

// Logout
function logout(){
    firebase.auth().signOut().then(()=> go("login.html"));
}
</script>

</body>
    </html>
