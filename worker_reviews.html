<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>My Reviews - Worker | Seva Care</title>

<style>
    body {
        font-family: Arial;
        background: #f1f5ff;
        margin: 0;
        text-align: center;
        padding: 20px;
    }
    h1 {
        color: #4a90e2;
    }

    .card {
        background: white;
        width: 90%;
        margin: 15px auto;
        padding: 20px;
        text-align: left;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .ratingBox {
        background: #fff;
        width: 90%;
        margin: 15px auto;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        text-align: center;
    }

    .backBtn {
        background: #4a90e2;
        border: none;
        padding: 10px 18px;
        margin-bottom: 20px;
        border-radius: 8px;
        color: white;
        font-size: 16px;
    }
</style>
</head>

<body>

<button class="backBtn" onclick="location.href='worker_home.html'">⬅ Back to Worker Dashboard</button>

<h1>⭐ My Reviews</h1>

<div id="ratingSummary" class="ratingBox">
    Loading rating summary...
</div>

<h2>Customer Reviews</h2>
<div id="reviewsList">Loading reviews...</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="auth.js"></script>

<script>
auth.onAuthStateChanged(async user => {
    if (!user) {
        alert("Login required!");
        window.location.href = "login.html";
        return;
    }

    loadRatingSummary(user.uid);
    loadReviews(user.uid);
});


// ----------------------------------
// Load Worker Rating Summary
// ----------------------------------
async function loadRatingSummary(workerId) {
    const doc = await db.collection("users").doc(workerId).get();

    if (!doc.exists) {
        document.getElementById("ratingSummary").innerHTML = "No rating data.";
        return;
    }

    const u = doc.data();
    let avg = "No Ratings Yet";

    if (u.ratingCount > 0) {
        avg = (u.ratingTotal / u.ratingCount).toFixed(1) + " ⭐";
    }

    document.getElementById("ratingSummary").innerHTML = `
        <h2>⭐ Average Rating: ${avg}</h2>
        <p><b>Total Reviews:</b> ${u.ratingCount || 0}</p>
    `;
}


// ----------------------------------
// Load All Reviews For Worker
// ----------------------------------
function loadReviews(workerId) {
    db.collection("reviews")
        .where("workerId", "==", workerId)
        .orderBy("timestamp", "desc")
        .onSnapshot(snapshot => {
            const list = document.getElementById("reviewsList");
            list.innerHTML = "";

            if (snapshot.empty) {
                list.innerHTML = "<p>No reviews yet.</p>";
                return;
            }

            snapshot.forEach(doc => {
                const r = doc.data();

                list.innerHTML += `
                    <div class="card">
                        <b>Rating:</b> ${r.rating} ⭐<br>
                        <b>Review:</b> ${r.reviewText}<br>
                        <b>Booking ID:</b> ${r.bookingId}<br>
                        <b>Date:</b> ${new Date(r.timestamp.toDate()).toLocaleString()}<br>
                    </div>
                `;
            });
        });
}
</script>

</body>
  </html>
