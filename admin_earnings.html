<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Earnings – Seva</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>
    body {
        font-family: Arial;
        margin: 0;
        background: #eef2ff;
        color: #111827;
        -webkit-font-smoothing: antialiased;
    }

    .wrap {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #2563eb;
        margin-bottom: 10px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 18px;
        margin-top: 20px;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0px 6px 20px rgba(0,0,0,0.06);
    }

    .title {
        font-weight: bold;
        color: #4b5563;
        font-size: 14px;
        margin-bottom: 4px;
    }

    .value {
        font-size: 32px;
        font-weight: 700;
        color: #111827;
    }

    .list {
        margin-top: 30px;
    }

    .entry {
        background: white;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 12px;
        box-shadow: 0px 6px 14px rgba(0,0,0,0.05);
    }

    .entry b {
        color: #111827;
    }

    .muted {
        color: #6b7280;
        font-size: 13px;
    }
</style>
</head>

<body>
<div class="wrap">

<h1>Admin Earnings Dashboard</h1>

<div class="cards">
    <div class="card">
        <div class="title">Total Platform Earnings</div>
        <div class="value" id="platformTotal">₹0</div>
    </div>
    <div class="card">
        <div class="title">Total Worker Earnings</div>
        <div class="value" id="workerTotal">₹0</div>
    </div>
    <div class="card">
        <div class="title">Total Completed Tasks</div>
        <div class="value" id="taskCount">0</div>
    </div>
</div>

<h2 style="margin-top:30px; color:#1d4ed8;">All Transactions</h2>
<div id="earnList" class="list">Loading...</div>

</div>

<script>
    // -----------------------------------------------
    // 🔥 YOUR REAL FIREBASE CONFIG
    // -----------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
        authDomain: "seva-6f191.firebaseapp.com",
        projectId: "seva-6f191",
        storageBucket: "seva-6f191.firebasestorage.app",
        messagingSenderId: "826093348416",
        appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
        measurementId: "G-78H32SRPCD"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // -----------------------------------------------
    // LOAD EARNINGS
    // -----------------------------------------------
    db.collection("earnings")
      .orderBy("timestamp", "desc")
      .onSnapshot(snapshot => {

        let totalPlatform = 0;
        let totalWorker = 0;
        let count = 0;

        let container = document.getElementById("earnList");
        container.innerHTML = "";

        snapshot.forEach(doc => {
            let d = doc.data();

            totalPlatform += d.platformEarn;
            totalWorker += d.workerEarn;
            count++;

            container.innerHTML += `
              <div class="entry">
                <b>Post ID:</b> ${doc.id}<br>
                <b>Worker:</b> ${d.workerId}<br>
                <b>Customer:</b> ${d.customerId}<br><br>

                <b>Worker Earned:</b> ₹${d.workerEarn}<br>
                <b>Platform Earned:</b> ₹${d.platformEarn}<br>
                <b>Total Amount:</b> ₹${d.totalAmount}<br>

                <div class="muted">Date: ${
                    d.timestamp ? d.timestamp.toDate().toLocaleString() : "N/A"
                }</div>
              </div>
            `;
        });

        document.getElementById("platformTotal").innerText = "₹" + totalPlatform;
        document.getElementById("workerTotal").innerText = "₹" + totalWorker;
        document.getElementById("taskCount").innerText = count;
      });

</script>

</body>
</html>
