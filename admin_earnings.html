<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Earnings Dashboard – Seva</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>
    body {
        font-family: Arial;
        background: #f4f6ff;
        padding: 20px;
        max-width: 1100px;
        margin: auto;
    }

    h1 {
        text-align: center;
        color: #4a90e2;
    }

    .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
        gap: 15px;
        margin-top: 25px;
    }

    .card {
        background: white;
        padding: 18px;
        border-radius: 14px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        border: 1px solid #e3e3e3;
        text-align: center;
    }

    .title {
        font-size: 15px;
        color: #6b7280;
    }

    .value {
        font-size: 26px;
        font-weight: bold;
        margin-top: 6px;
    }

    .list {
        margin-top: 30px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 6px 16px rgba(0,0,0,0.05);
    }

    th, td {
        padding: 12px;
        border-bottom: 1px solid #eee;
        text-align: center;
    }

    th {
        background: #4a90e2;
        color: white;
    }

    .filter {
        margin: 20px 0;
        text-align: center;
    }

    select {
        padding: 8px 12px;
        font-size: 16px;
        border-radius: 8px;
    }

</style>
</head>

<body>

<h1>Admin Earnings Dashboard</h1>

<div class="filter">
    <label><b>Filter:</b></label>
    <select id="dateFilter" onchange="loadEarnings()">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
    </select>
</div>

<div class="summary">
    <div class="card">
        <div class="title">Total Platform Earnings</div>
        <div class="value" id="platformTotal">₹0</div>
    </div>

    <div class="card">
        <div class="title">Total Worker Earnings</div>
        <div class="value" id="workerTotal">₹0</div>
    </div>

    <div class="card">
        <div class="title">Total Customer Payments</div>
        <div class="value" id="customerTotal">₹0</div>
    </div>

    <div class="card">
        <div class="title">Completed Tasks</div>
        <div class="value" id="taskCount">0</div>
    </div>
</div>

<div class="list">
    <h2>Completed Tasks List</h2>
    <table>
        <thead>
            <tr>
                <th>Task</th>
                <th>Price</th>
                <th>Platform Fee</th>
                <th>Worker Earning</th>
                <th>Customer</th>
                <th>Worker</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="taskTable"></tbody>
    </table>
</div>

<script>
    // FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
        authDomain: "seva-6f191.firebaseapp.com",
        projectId: "seva-6f191",
        storageBucket: "seva-6f191.firebasestorage.app",
        messagingSenderId: "826093348416",
        appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
        measurementId: "G-78H32SRPCD"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    function loadEarnings() {
        const filter = document.getElementById("dateFilter").value;

        let query = db.collection("posts").where("status", "==", "completed");

        let now = new Date();

        if (filter === "today") {
            let start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            query = query.where("completedAt", ">=", start);
        }

        if (filter === "week") {
            let start = new Date();
            start.setDate(now.getDate() - 7);
            query = query.where("completedAt", ">=", start);
        }

        if (filter === "month") {
            let start = new Date(now.getFullYear(), now.getMonth(), 1);
            query = query.where("completedAt", ">=", start);
        }

        query.onSnapshot(snapshot => {
            let platformTotal = 0;
            let workerTotal = 0;
            let customerTotal = 0;
            let count = 0;

            let tableHTML = "";

            snapshot.forEach(doc => {
                let d = doc.data();

                if (!d.customerPrice) return;

                let price = d.customerPrice;
                let platformFee = 50;
                let workerEarn = price - platformFee;

                platformTotal += platformFee;
                workerTotal += workerEarn;
                customerTotal += price;
                count++;

                tableHTML += `
                    <tr>
                        <td>${d.text || "Voice Request"}</td>
                        <td>₹${price}</td>
                        <td>₹50</td>
                        <td>₹${workerEarn}</td>
                        <td>${d.userId}</td>
                        <td>${d.acceptedBy}</td>
                        <td>${new Date(d.completedAt?.toDate()).toLocaleString()}</td>
                    </tr>
                `;
            });

            document.getElementById("platformTotal").innerText = "₹" + platformTotal;
            document.getElementById("workerTotal").innerText = "₹" + workerTotal;
            document.getElementById("customerTotal").innerText = "₹" + customerTotal;
            document.getElementById("taskCount").innerText = count;

            document.getElementById("taskTable").innerHTML = tableHTML;
        });
    }

    loadEarnings();
</script>

</body>
  </html>
