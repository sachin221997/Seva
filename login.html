<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>❤️ Seva Care</h1>
</header>

<section>
    <h2>Login to Your Account</h2>

    <input type="email" id="email" placeholder="Email" required><br><br>

    <input type="password" id="password" placeholder="Password" required><br><br>

    <button onclick="loginUser()">Login</button>
</section>

<footer>
    <p>© 2025 Seva – Spreading Care & Happiness ❤️</p>
</footer>

<!-- Firebase V8 SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
    // Firebase Config
    var firebaseConfig = {
        apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
        authDomain: "seva-6f191.firebaseapp.com",
        projectId: "seva-6f191",
        storageBucket: "seva-6f191.appspot.com",
        messagingSenderId: "826093348416",
        appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
        measurementId: "G-78H32SRPCD"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // LOGIN FUNCTION
    function loginUser() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!email || !password) {
            alert("Please enter email and password");
            return;
        }

        auth.signInWithEmailAndPassword(email, password)
            .then(async (userCred) => {
                const uid = userCred.user.uid;

                // Read user profile
                const snap = await db.collection("users").doc(uid).get();
                const user = snap.data();

                if (!user) {
                    alert("User data not found in database");
                    return;
                }

                // Redirect by role
                if (user.role === "customer") {
                    window.location.href = "customer_home.html";
                } else {
                    window.location.href = "worker_home.html";
                }
            })
            .catch((err) => {
                alert(err.message);
            });
    }
</script>

</body>
</html>
