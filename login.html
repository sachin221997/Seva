<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seva Care - Login</title>

<style>
body { margin:0; font-family: Inter; background:#e8f5e9; }
.header { background:#1b5e20; padding:25px; color:white; font-size:32px; text-align:center; font-weight:700; }
.card { width:90%; max-width:380px; margin:40px auto; background:white; padding:25px; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,0.15); text-align:center; }
input { width:90%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #aaa; }
.btn { width:90%; padding:12px; border:none; background:#1b5e20; color:white; font-size:18px; border-radius:8px; cursor:pointer; }
.link { display:block; margin-top:10px; color:#2e7d32; }
.footer { text-align:center; padding:25px; background:#1b5e20; color:white; margin-top:40px; }
</style>
</head>

<body>

<div class="header"> Seva Care</div>

<div class="card">
<h2>Login to Your Account</h2>

<input type="email" id="username" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button class="btn" onclick="login()">Login</button>

<a class="link" href="forgot.html">Forgot Password?</a>
<a class="link" href="signup.html">Create Account</a>
</div>

<div class="footer">© 2026 Seva Care – Spreading Happiness & Care ❤️</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.appspot.com",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);

function login(){
    let email = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    firebase.auth().signInWithEmailAndPassword(email, pass)
    .then(()=>{
        alert("Login Successful!");

        // 🔥 Correct redirect
        window.location.href = "/Seva/role.html";
    })
    .catch(err => alert(err.message));
}
</script>

</body>
</html>
