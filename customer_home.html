<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customer Dashboard – Seva Care</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        font-family: Arial;
        background: #f1f5ff;
        text-align: center;
        padding: 20px;
    }
    h1 { color: #4a90e2; }

    .card {
        background: white;
        width: 85%;
        margin: 15px auto;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0px 0px 12px rgba(0,0,0,0.1);
    }

    button {
        background: #4a90e2;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        margin-top: 10px;
        width: 80%;
        font-size: 18px;
    }

    #logoutBtn {
        background: #d9534f;
    }
</style>
</head>

<body>

<h1>Customer Dashboard</h1>
<p id="customerEmail">Loading...</p>

<!-- SERVICE LIST -->
<div class="card">
    <h2>Available Services</h2>

    <button onclick="bookService('Home Cleaning')">Home Cleaning</button><br><br>

    <button onclick="bookService('Massage Service')">Massage Service</button><br><br>

    <button onclick="bookService('Electrician')">Electrician</button><br><br>

    <button onclick="bookService('Plumber')">Plumber</button><br><br>

    <button onclick="bookService('Carpenter')">Carpenter</button><br><br>

    <button onclick="bookService('Cooking Help')">Cooking Help</button><br><br>
</div>

<!-- NEW FEATURES -->
<div class="card">
    <h2>New Features</h2>

    <button onclick="goCreatePost()">Create Request (Text + Voice)</button><br><br>

    <button onclick="goMyRequests()">My Requests</button><br><br>

    <button onclick="goTrackWorker()">Track Worker</button>
</div>

<button id="logoutBtn" onclick="logout()">Logout</button>

<!-- Firebase v8 SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
    // FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
      authDomain: "seva-6f191.firebaseapp.com",
      projectId: "seva-6f191",
      storageBucket: "seva-6f191.firebasestorage.app",
      messagingSenderId: "826093348416",
      appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
      measurementId: "G-78H32SRPCD"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // PROTECT PAGE
    auth.onAuthStateChanged(user => {
        if (!user) {
            window.location.href = "login.html";
        } else {
            document.getElementById("customerEmail").innerText = "Logged in as: " + user.email;
        }
    });

    // BOOK SERVICE
    function bookService(serviceName) {
        let user = auth.currentUser;

        if (!user) {
            alert("Please login");
            return;
        }

        db.collection("bookings").add({
            email: user.email,
            userEmail: user.email,
            service: serviceName,
            time: new Date().toISOString(),
            status: "pending"
        })
        .then(() => {
            alert("Service booked successfully!");
        });
    }

    // NEW PAGE LINKS
    function goCreatePost() {
        window.location.href = "create_post.html";
    }

    function goMyRequests() {
        window.location.href = "my_requests.html";
    }

    function goTrackWorker() {
        window.location.href = "track_worker.html";
    }

    // LOGOUT
    function logout() {
        auth.signOut().then(() => {
            window.location.href = "login.html";
        });
    }
</script>

</body>
</html>
                                                                  </html>
