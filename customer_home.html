<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard - Seva Care</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5ff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #4a90e2;
        }

        .card {
            background: white;
            width: 85%;
            margin: 15px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 12px rgba(0,0,0,0.1);
        }

        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            margin-top: 10px;
            width: 80%;
            font-size: 18px;
        }

        #logoutBtn {
            background: #d9534f;
        }
    </style>
</head>

<body>

    <h1>Customer Dashboard</h1>
    <p id="customerEmail">Loading...</p>

    <!-- SERVICE LIST -->
    <div class="card">
        <h2>Available Services</h2>

        <button onclick="bookService('Home Cleaning')">Home Cleaning</button>
        <br><br>

        <button onclick="bookService('Massage Service')">Massage Service</button>
        <br><br>

        <button onclick="bookService('Electrician')">Electrician</button>
        <br><br>

        <button onclick="bookService('Plumber')">Plumber</button>
        <br><br>

        <button onclick="bookService('Carpenter')">Carpenter</button>
        <br><br>

        <button onclick="bookService('Cooking Help')">Cooking Help</button>
    </div>

    <button id="logoutBtn" onclick="logout()">Logout</button>

    <!-- Firebase v10 SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <!-- Your JS -->
    <script src="auth.js"></script>

    <script>
        // Load customer info
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("customerEmail").innerText =
                "Logged in as: " + user.email;
        });
    </script>

</body>
</html>
                                                                  </html>
