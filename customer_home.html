<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard - Seva Care</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f1f5ff;
            padding: 20px;
        }

        h1 {
            color: #4a90e2;
        }

        .card {
            background: white;
            width: 85%;
            margin: 15px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 12px rgba(0,0,0,0.1);
        }

        button {
            background: #4a90e2;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            margin-top: 10px;
            width: 80%;
            font-size: 18px;
        }

        #logoutBtn {
            background: #d9534f;
        }
    </style>
</head>

<body>

    <h1>Welcome to Seva Care</h1>
    <p id="userEmail">Loading...</p>

    <div class="card">
        <h2>Available Services</h2>

        <button onclick="bookService('Home Cleaning')">Home Cleaning</button><br>
        <button onclick="bookService('Massage Service')">Massage Service</button><br>
        <button onclick="bookService('Electrician')">Electrician</button><br>
        <button onclick="bookService('Plumber')">Plumber</button><br>
        <button onclick="bookService('Carpenter')">Carpenter</button><br>
        <button onclick="bookService('Cooking Help')">Cooking Help</button><br>
    </div>

    <button id="logoutBtn" onclick="logout()">Logout</button>

    <!-- Firebase v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <!-- Your JS -->
    <script src="auth.js"></script>

    <script>
        // Show logged-in user's email
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById("userEmail").innerText = "Logged in as: " + user.email;
            } else {
                window.location.href = "login.html";
            }
        });
    </script>

</body>
                                                                  </html>
