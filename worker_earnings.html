<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Worker Earnings – Seva</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<style>
  body {
    background:#f1f5ff;
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    max-width:900px;
    margin:auto;
  }
  h1 {
    text-align:center;
    color:#4a90e2;
    margin-bottom:10px;
  }
  .summary-box {
    background:white;
    padding:18px;
    margin-top:20px;
    border-radius:12px;
    box-shadow:0 4px 18px rgba(0,0,0,0.1);
    text-align:center;
  }
  .amount {
    font-size:30px;
    font-weight:bold;
    color:#16a34a;
  }
  .card {
    background:white;
    padding:16px;
    margin-top:16px;
    border-radius:10px;
    box-shadow:0 4px 18px rgba(0,0,0,0.1);
  }
  .meta {
    color:#666;
    font-size:13px;
    margin-top:4px;
  }
  .earn-badge {
    background:#10B981;
    color:white;
    padding:4px 10px;
    border-radius:20px;
    font-size:12px;
    margin-left:10px;
  }
</style>
</head>

<body>

<h1>Worker Earnings</h1>
<div class="summary-box">
  <div>Total Earnings (Today)</div>
  <div class="amount" id="todayEarn">₹0</div>
</div>

<div class="summary-box">
  <div>Total Earnings (Lifetime)</div>
  <div class="amount" id="lifeEarn">₹0</div>
</div>

<h2 style="color:#4a90e2;margin-top:30px;">All Completed Tasks</h2>
<div id="tasks">Loading...</div>

<script>
  // -----------------------------------
  // YOUR FIREBASE CONFIG
  // -----------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // LOGIN CHECK
  auth.onAuthStateChanged(user => {
    if (!user) {
      document.getElementById("tasks").innerHTML = "<p>Please login first.</p>";
      return;
    }
    loadEarnings(user.uid);
  });

  // LOAD EARNINGS (Option A)
  function loadEarnings(workerId) {
    db.collection("earnings")
      .where("workerId", "==", workerId)
      .orderBy("timestamp", "desc")
      .onSnapshot(snapshot => {

        let tasksBox = document.getElementById("tasks");
        tasksBox.innerHTML = "";

        let todayTotal = 0;
        let lifetimeTotal = 0;

        const todayDate = new Date().toDateString();

        snapshot.forEach(doc => {
          const e = doc.data();

          // Add earnings
          lifetimeTotal += e.workerEarning;

          const taskDate = new Date(e.timestamp?.toDate()).toDateString();
          if (taskDate === todayDate) {
            todayTotal += e.workerEarning;
          }

          // Display each task
          tasksBox.innerHTML += `
            <div class="card">
              <div><b>Work Type:</b> ${e.workType}</div>
              <div><b>Customer Price:</b> ₹${e.customerPrice}</div>
              <div><b>Platform Fee:</b> ₹${e.platformFee}</div>
              <div><b>Worker Earned:</b> <span class="earn-badge">₹${e.workerEarning}</span></div>
              <div class="meta">${new Date(e.timestamp?.toDate()).toLocaleString()}</div>
            </div>
          `;
        });

        document.getElementById("todayEarn").innerText = "₹" + todayTotal;
        document.getElementById("lifeEarn").innerText = "₹" + lifetimeTotal;

      });
  }
</script>

</body>
</html>
