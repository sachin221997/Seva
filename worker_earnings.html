<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Worker Earnings - Seva</title>

<style>
    body {
        font-family: Arial;
        background: #f1f5ff;
        text-align: center;
        padding: 20px;
    }

    h1 {
        color: #4a90e2;
    }

    .card {
        background: white;
        width: 90%;
        margin: 15px auto;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        text-align: left;
    }

    .amount {
        font-size: 22px;
        font-weight: bold;
        color: green;
    }

    nav a {
        margin: 10px;
        text-decoration: none;
        color: #4a90e2;
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>💰 Your Earnings</h1>

<nav>
    <a href="worker_home.html">Home</a>
    <a href="worker_earnings.html">Earnings</a>
    <a href="contact.html">Contact</a>
</nav>

<h2>Total Earned:</h2>
<p class="amount" id="totalEarnings">Loading...</p>

<h2>Earnings History</h2>
<div id="earningsList">Loading history...</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="auth.js"></script>

<script>
// Load worker earnings
auth.onAuthStateChanged(async user => {
    if (!user) {
        alert("Please login first");
        window.location.href = "login.html";
        return;
    }

    const workerId = user.uid;

    // Load worker profile for total earnings
    const userRef = db.collection("users").doc(workerId);
    const doc = await userRef.get();

    if (doc.exists) {
        const data = doc.data();
        document.getElementById("totalEarnings").innerText =
            "₹ " + (data.earnings || 0);
    }

    // Load detailed earning records
    db.collection("earnings")
        .where("workerId", "==", workerId)
        .orderBy("timestamp", "desc")
        .onSnapshot(snapshot => {
            const list = document.getElementById("earningsList");

            if (snapshot.empty) {
                list.innerHTML = "<p>No earnings yet.</p>";
                return;
            }

            list.innerHTML = "";

            snapshot.forEach(docItem => {
                const e = docItem.data();

                list.innerHTML += `
                    <div class="card">
                        <b>Amount: </b> ₹ ${e.amount} <br>
                        <b>Service: </b> ${e.service || "Service"} <br>
                        <b>Booking ID: </b> ${e.jobId} <br>
                        <b>Date: </b> ${new Date(e.timestamp.seconds * 1000).toLocaleString()}
                    </div>
                `;
            });
        });
});
</script>

</body>
  </html>
