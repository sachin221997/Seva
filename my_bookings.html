<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings - Seva Care</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5ff;
            margin: 0;
            text-align: center;
        }

        header {
            background: white;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            color: #4a90e2;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: #4a90e2;
            font-weight: bold;
        }

        .card {
            background: white;
            width: 85%;
            margin: 15px auto;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .title {
            font-size: 22px;
            color: #333;
        }

        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px;
            width: 80%;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>❤️ Seva Care</h1>
    <nav>
        <a href="customer_home.html">Home</a>
        <a href="seva.html">Services</a>
        <a href="my_bookings.html">My Bookings</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<h2 class="title">My Bookings</h2>
<p id="customerEmail">Loading...</p>

<div id="bookingList">Loading your bookings...</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="auth.js"></script>

<script>
auth.onAuthStateChanged(async user => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("customerEmail").innerText = "Logged in as: " + user.email;

    // Load bookings for this customer
    db.collection("bookings")
        .where("customerId", "==", user.uid)
        .orderBy("createdAt", "desc")
        .onSnapshot(snapshot => {
            const list = document.getElementById("bookingList");

            if (snapshot.empty) {
                list.innerHTML = "<p>No bookings found.</p>";
                return;
            }

            list.innerHTML = "";

            snapshot.forEach(doc => {
                const b = doc.data();

                list.innerHTML += `
                <div class="card">
                    <b>Service:</b> ${b.service}<br>
                    <b>Status:</b> ${b.status}<br>
                    <b>Price:</b> ₹${b.price}<br>
                    <b>Assigned Worker:</b> ${b.assignedWorkerId || "Not Assigned"}<br>
                    <b>Date:</b> ${new Date(b.time).toLocaleString()}<br><br>

                    ${
                        b.status === "completed"
                        ? `<button onclick="location.href='rate_worker.html?booking=${doc.id}'">Rate Worker</button>`
                        : ""
                    }
                </div>
                `;
            });
        });
});
</script>

</body>
</html>
