<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>❤️ Seva Care</h1>
</header>

<section>
    <h2>Reset Your Password</h2>

    <p>Enter your registered email.  
       We will send you a password reset link.</p>

    <input type="email" id="email" placeholder="Enter your email" required><br><br>

    <button onclick="resetPassword()">Send Reset Link</button>
</section>

<footer>
    <p>© 2025 Seva – Spreading Care & Happiness ❤️</p>
</footer>

<!-- Firebase V8 SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
    // Firebase Config
    var firebaseConfig = {
        apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
        authDomain: "seva-6f191.firebaseapp.com",
        projectId: "seva-6f191",
        storageBucket: "seva-6f191.appspot.com",
        messagingSenderId: "826093348416",
        appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
        measurementId: "G-78H32SRPCD"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // RESET PASSWORD FUNCTION
    function resetPassword() {
        const email = document.getElementById("email").value.trim();

        if (!email) {
            alert("Please enter your email");
            return;
        }

        auth.sendPasswordResetEmail(email)
            .then(() => {
                alert("A password reset link has been sent to your email.");
            })
            .catch((error) => {
                alert(error.message);
            });
    }
</script>

</body>
</html>
