<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seva - Reset Password</title>

<style>
body{margin:0;font-family:Inter;background:#e8f5e9;}
.header{background:#1b5e20;padding:25px;color:white;font-size:32px;text-align:center;font-weight:700;}
.card{width:90%;max-width:380px;margin:40px auto;background:white;padding:25px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,0.15);text-align:center;}
.card h2{color:#1b5e20;}
input{width:90%;padding:12px;margin:10px 0;border:1px solid #aaa;border-radius:8px;}
.btn{width:95%;padding:12px;background:#2e7d32;color:white;border:none;border-radius:8px;font-size:18px;margin-top:10px;cursor:pointer;}
.link{display:block;margin-top:10px;color:#2e7d32;}
.footer{text-align:center;padding:25px;background:#1b5e20;color:white;margin-top:40px;}
</style>
</head>

<body>

<div class="header">❤️ Seva Care</div>

<div class="card">
<h2>Reset Password</h2>
<input type="email" id="email" placeholder="Enter Email">
<button class="btn" onclick="resetPass()">Send Reset Link</button>
<a class="link" href="login.html">Back to Login</a>
</div>

<div class="footer">© 2025 Seva ❤️</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);

function resetPass(){
    let email = document.getElementById("email").value;
    firebase.auth().sendPasswordResetEmail(email)
    .then(()=>{
        alert("Reset link sent! Check your email.");
        window.location.href="login.html";
    })
    .catch(err=>alert(err.message));
}
</script>
</body>
</html>
