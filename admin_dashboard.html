<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Seva</title>

<style>
body{
    margin:0;
    font-family:Inter, Arial;
    background:#f0fdf4;
}
.top{
    background:#14532d;
    padding:20px;
    color:white;
    font-size:26px;
    font-weight:700;
    text-align:center;
}
.container{
    max-width:1100px;
    margin:20px auto;
    padding:10px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,0.12);
}

.card h2{
    margin:8px 0;
    font-size:20px;
    color:#14532d;
}

.card p{
    font-size:28px;
    color:#0f5132;
    font-weight:700;
}

.link-box{
    margin-top:30px;
    text-align:center;
}

.link-box a{
    display:block;
    margin:10px 0;
    text-decoration:none;
    font-size:18px;
    font-weight:700;
    color:#14532d;
}

.logout{
    margin-top:20px;
    text-align:center;
}
.logout button{
    background:#d32f2f;
    border:none;
    padding:10px 20px;
    font-size:16px;
    color:white;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="top">Admin Dashboard</div>

<div class="container">

    <div class="grid">

        <div class="card">
            <h2>Total Users</h2>
            <p id="totalUsers">0</p>
        </div>

        <div class="card">
            <h2>Total Workers</h2>
            <p id="totalWorkers">0</p>
        </div>

        <div class="card">
            <h2>Total Customers</h2>
            <p id="totalCustomers">0</p>
        </div>

        <div class="card">
            <h2>Pending KYC</h2>
            <p id="pendingKYC">0</p>
        </div>

        <div class="card">
            <h2>Approved KYC</h2>
            <p id="approvedKYC">0</p>
        </div>

        <div class="card">
            <h2>Total Jobs Posted</h2>
            <p id="totalJobs">0</p>
        </div>

        <div class="card">
            <h2>Completed Jobs</h2>
            <p id="completedJobs">0</p>
        </div>

        <div class="card">
            <h2>Platform Earnings (₹)</h2>
            <p id="platformEarnings">0</p>
        </div>

    </div>

    <div class="link-box">
        <a href="admin_kyc.html">→ Verify KYC</a>
        <a href="worker_list.html">→ Manage Workers (Block / Unblock)</a>
        <a href="admin_jobs.html">→ Manage Jobs</a>
    </div>

    <div class="logout">
        <button onclick="logout()">Logout</button>
    </div>

</div>


<!-- FIREBASE V8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// Firebase Config
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


// ✔ CHECK ADMIN LOGIN
auth.onAuthStateChanged(async user=>{
    if(!user){
        window.location.href = "login.html";
        return;
    }

    const adminDoc = await db.collection("admins").doc(user.uid).get();
    if(!adminDoc.exists){
        alert("Access Denied — You Are Not Admin");
        window.location.href = "login.html";
        return;
    }

    loadDashboard();
});


// ✔ LOAD ALL STATS
function loadDashboard(){

    // Total Users
    db.collection("users").onSnapshot(snap=>{
        document.getElementById("totalUsers").innerText = snap.size;

        let workers = 0;
        let customers = 0;
        let pending = 0;
        let approved = 0;

        snap.forEach(doc=>{
            let u = doc.data();

            if(u.role === "worker") workers++;
            if(u.role === "customer") customers++;

            if(u.kycStatus === "pending") pending++;
            if(u.kycStatus === "approved") approved++;
        });

        document.getElementById("totalWorkers").innerText = workers;
        document.getElementById("totalCustomers").innerText = customers;
        document.getElementById("pendingKYC").innerText = pending;
        document.getElementById("approvedKYC").innerText = approved;
    });


    // Total Jobs
    db.collection("jobs").onSnapshot(snap=>{
        document.getElementById("totalJobs").innerText = snap.size;

        let completed = 0;
        snap.forEach(job=>{
            if(job.data().status === "completed") completed++;
        });

        document.getElementById("completedJobs").innerText = completed;
    });


    // Platform Earnings
    db.collection("platform").doc("revenue").onSnapshot(doc=>{
        if(doc.exists){
            document.getElementById("platformEarnings").innerText =
                doc.data().totalRevenue || doc.data().total || 0;
        }
    });

}


// ✔ LOGOUT
function logout(){
    auth.signOut().then(()=>{
        window.location.href = "login.html";
    });
}

</script>

</body>
</html>
