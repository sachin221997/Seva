<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Completed Jobs - Seva Care</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5ff;
            margin: 0;
            text-align: center;
        }

        header {
            background: white;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            color: #4a90e2;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #4a90e2;
            font-weight: bold;
        }

        .card {
            background: white;
            width: 85%;
            margin: 15px auto;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: left;
        }

        h2 {
            color: #333;
        }
    </style>
</head>

<body>

<header>
    <h1>❤️ Seva Care</h1>
    <nav>
        <a href="worker_home.html">Home</a>
        <a href="worker_history.html">Completed Jobs</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<h2>Completed Jobs</h2>
<p id="workerEmail">Loading...</p>

<div id="historyList">Loading your completed jobs...</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="auth.js"></script>

<script>
auth.onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("workerEmail").innerText =
        "Logged in as: " + user.email;

    // Load completed jobs for this worker
    db.collection("bookings")
        .where("assignedWorkerId", "==", user.uid)
        .where("status", "==", "completed")
        .orderBy("completedAt", "desc")
        .onSnapshot(snapshot => {
            const list = document.getElementById("historyList");

            if (snapshot.empty) {
                list.innerHTML = "<p>No completed jobs yet.</p>";
                return;
            }

            list.innerHTML = "";

            snapshot.forEach(doc => {
                const data = doc.data();
                
                list.innerHTML += `
                    <div class="card">
                        <b>Service:</b> ${data.service}<br>
                        <b>Customer:</b> ${data.userEmail}<br>
                        <b>Total Price:</b> ₹${data.price}<br>
                        <b>Your Earnings:</b> ₹${data.price - data.platformFee}<br>
                        <b>Platform Fee:</b> ₹${data.platformFee}<br>
                        <b>Completed On:</b> ${new Date(data.completedAt).toLocaleString()}<br>
                    </div>
                `;
            });
        });
});
</script>

</body>
  </html>
