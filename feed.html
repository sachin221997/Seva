<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nearby Requests – Seva</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    .card {
      border: 1px solid #ddd;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 8px;
    }
    button {
      padding: 8px 14px;
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 8px;
    }
    #notif {
      display: none;
      background: #ff3b30;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h2>📌 Nearby Requests</h2>

<div id="notif"></div>

<div id="feed">Loading nearby requests...</div>

<script>
  // ----------------------------------------
  // 🔥 YOUR REAL FIREBASE CONFIG
  // ----------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ----------------------------------------
  // AUTH CHECK
  // ----------------------------------------
  auth.onAuthStateChanged(user => {
    if (!user) {
      document.getElementById("feed").innerHTML = "<p>Please login first.</p>";
    } else {
      loadFeed();
    }
  });

  // ----------------------------------------
  // Distance function (km)
  // ----------------------------------------
  function distanceKm(lat1, lon1, lat2, lon2){
      const R = 6371;
      const dLat = (lat2-lat1) * Math.PI/180;
      const dLon = (lon2-lon1) * Math.PI/180;
      const a =
          Math.sin(dLat/2)**2 +
          Math.cos(lat1*Math.PI/180) *
          Math.cos(lat2*Math.PI/180) *
          Math.sin(dLon/2)**2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
  }

  // ----------------------------------------
  // LOAD FEED (Realtime)
  // ----------------------------------------
  function loadFeed() {
    navigator.geolocation.getCurrentPosition((pos) => {
      let myLat = pos.coords.latitude;
      let myLng = pos.coords.longitude;

      let feedBox = document.getElementById("feed");

      db.collection("posts")
        .where("status", "==", "open")
        .orderBy("timestamp", "desc")
        .onSnapshot(snapshot => {

          feedBox.innerHTML = "";
          let count = 0;

          snapshot.forEach(doc => {
            let d = doc.data();

            if (!d.lat || !d.lng) return;

            let km = distanceKm(myLat, myLng, d.lat, d.lng);

            // Only show requests within 10 km
            if (km <= 10) {

              count++;

              let html = `
                <div class="card">
                  <p><b>Message:</b> ${d.text || "<i>Voice-only request</i>"}</p>
                  <p><b>Distance:</b> ${km.toFixed(1)} km</p>
                  <p><b>Posted:</b> ${new Date(d.timestamp?.toDate()).toLocaleString()}</p>
              `;

              if (d.voiceUrl) {
                html += `
                  <audio controls src="${d.voiceUrl}" style="width:100%; margin-top: 6px;"></audio>
                `;
              }

              html += `
                  <br>
                  <button onclick="openPost('${doc.id}')">View / Accept</button>
                </div>
              `;

              feedBox.innerHTML += html;
            }
          });

          // Notification bubble
          const notif = document.getElementById("notif");

          if (count > 0) {
            notif.style.display = "block";
            notif.innerText = count + " nearby";
            setTimeout(() => notif.style.display = "none", 4000);
          }

        });

    }, () => {
      document.getElementById("feed").innerHTML = "<p>Location blocked. Enable GPS.</p>";
    });
  }

  // ----------------------------------------
  // OPEN POST DETAILS PAGE
  // ----------------------------------------
  function openPost(id){
    window.location.href = "post_details.html?postId=" + id;
  }

</script>

</body>
</html>
