<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Post a Need</title>

  <style>
    :root{
      --bg:#F0FDF4;           /* Option C Background */
      --card:#ffffff;
      --accent:#22C55E;       /* Primary Green */
      --accent-dark:#15803D;  /* Dark Green */
      --muted:#666;
      --radius:12px;
      font-family: Inter, system-ui, Arial;
    }

    html,body{
      margin:0;
      background:var(--bg);
      color:#111;
    }

    /* =======================
          TOP NAVIGATION
       ======================= */

    .topnav {
      background: var(--accent);
      color: white;
      padding: 14px 20px;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .topnav .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .topnav .links a {
      margin-left: 20px;
      color: white;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: 0.2s;
    }

    .topnav .links a:hover {
      opacity: 0.8;
    }

    @media (max-width: 700px) {
      .topnav {
        flex-direction: column;
        text-align: center;
      }
      .topnav .links {
        margin-top: 8px;
      }
      .topnav .links a {
        display: inline-block;
        margin: 6px 10px;
      }
    }

    /* =======================
          MAIN DESIGN
       ======================= */

    .container{
      max-width:880px;
      margin:20px auto;
      padding:20px;
    }

    .card{
      background:var(--card);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:0 6px 18px rgba(20,20,50,0.06);
      margin-bottom:20px;
    }

    h2{
      margin:0 0 14px;
    }

    form{display:grid; gap:14px;}

    .row{
      display:grid;
      grid-template-columns:1fr 180px;
      gap:14px;
    }

    label{
      font-weight:600;
      margin-bottom:6px;
      display:block;
    }

    input[type="text"], input[type="number"], textarea, select {
      width:100%;
      padding:10px 12px;
      border:1px solid #e6e9ef;
      border-radius:10px;
      font-size:15px;
      background:white;
    }

    textarea{
      min-height:110px;
      resize:vertical;
    }

    .small{font-size:13px;color:var(--muted);}

    button{
      background:var(--accent);
      color:white;
      border:none;
      padding:10px 14px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
    }

    button.ghost{
      background:transparent;
      color:var(--accent-dark);
      border:1px solid var(--accent);
    }

    .preview{
      border:1px dashed #ccc;
      padding:10px;
      border-radius:10px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .thumb{
      width:150px;
      height:110px;
      object-fit:cover;
      border-radius:8px;
      border:1px solid #ddd;
      display:none;
    }

    ul.needs{
      list-style:none;
      padding:0;
      display:grid;
      gap:14px;
    }

    li.need{
      padding:14px;
      border-radius:12px;
      background:white;
      display:flex;
      gap:14px;
      box-shadow:0 4px 14px rgba(0,0,0,0.05);
    }

    .meta{flex:1;}
    .tag{
      background:#DCFCE7;
      color:#15803D;
      padding:6px 10px;
      border-radius:20px;
      font-size:12px;
      margin-right:6px;
    }
  </style>
</head>

<body>

  <!-- =======================
          TOP NAV BAR
       ======================= -->
  <nav class="topnav">
    <div class="logo">Seva</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="need.html">Post Need</a>
      <a href="jobs.html">Jobs</a>
      <a href="help.html">Help</a>
      <a href="about.html">About</a>
    </div>
  </nav>


  <div class="container">

    <section class="card">
      <h2>Post a Need</h2>

      <form id="needForm" autocomplete="off" novalidate>

        <div>
          <label for="title">Title</label>
          <input id="title" name="title" type="text" placeholder="e.g., Need a home tutor" required>
        </div>

        <div>
          <label for="category">Category</label>
          <select id="category">
            <option>Home Services</option>
            <option>Tutoring</option>
            <option>Delivery</option>
            <option>Cleaning</option>
            <option>Other</option>
          </select>
        </div>

        <div class="row">
          <div>
            <label>Description</label>
            <textarea id="description" placeholder="Describe your need..." required></textarea>
          </div>

          <div>
            <label>Image (optional)</label>
            <div class="preview">
              <img id="imgPreview" class="thumb">
              <div class="small" id="noImg">No image selected</div>
              <input type="file" id="image" accept="image/*">
            </div>
          </div>
        </div>

        <div class="row">
          <div>
            <label>Budget (optional)</label>
            <input id="budget" type="number" placeholder="500">
          </div>
          <div>
            <label>Location</label>
            <input id="location" type="text" placeholder="City / Area" required>
          </div>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" id="saveBtn">Post Need</button>
          <button type="button" class="ghost" id="clearBtn">Clear</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Your Needs</h2>
      <ul id="needsList" class="needs"></ul>
    </section>

  </div>

  <script type="module">
    class NeedApp {
      constructor(){
        this.form = document.getElementById("needForm");
        this.needsList = document.getElementById("needsList");
        this.preview = document.getElementById("imgPreview");
        this.noImg = document.getElementById("noImg");
        this.imageInput = document.getElementById("image");

        this.key = "my_app_needs_v1";
        this.needs = this.load();
        this.bind();
        this.render();
      }

      bind(){
        this.form.addEventListener("submit", e => this.submit(e));
        document.getElementById("clearBtn").addEventListener("click", () => this.clear());
        this.imageInput.addEventListener("change", e => this.previewImg(e));
      }

      load(){
        return JSON.parse(localStorage.getItem(this.key) || "[]");
      }

      save(){
        localStorage.setItem(this.key, JSON.stringify(this.needs));
      }

      async submit(e){
        e.preventDefault();

        const title = title.value.trim();
        const desc = description.value.trim();
        const loc = location.value.trim();
        const cat = category.value;
        const bud = budget.value;

        if(!title || !desc || !loc){
          alert("Please fill all required fields.");
          return;
        }

        let img = null;
        if(this.imageInput.files[0]){
          img = await this.fileToBase64(this.imageInput.files[0]);
        }

        this.needs.unshift({
          id: Date.now(),
          title, description:desc, location:loc,
          category:cat, budget:bud, image:img,
          createdAt: new Date().toISOString()
        });

        this.save();
        this.render();
        this.clear();
      }

      fileToBase64(file){
        return new Promise(res=>{
          const r = new FileReader();
          r.onload=()=>res(r.result);
          r.readAsDataURL(file);
        });
      }

      previewImg(e){
        const file = e.target.files[0];
        if(!file){
          this.preview.style.display="none";
          this.noImg.style.display="block";
          return;
        }
        const url = URL.createObjectURL(file);
        this.preview.src = url;
        this.preview.style.display="block";
        this.noImg.style.display="none";
      }

      clear(){
        this.form.reset();
        this.preview.style.display="none";
        this.noImg.style.display="block";
      }

      render(){
        this.needsList.innerHTML = "";

        if(this.needs.length===0){
          this.needsList.innerHTML = "<li class='small'>No needs posted yet.</li>";
          return;
        }

        this.needs.forEach(n=>{
          const li=document.createElement("li");
          li.className="need";

          li.innerHTML = `
            <div class="meta">
              <h3>${n.title}</h3>
              <p>${n.description}</p>
              <span class="tag">${n.location}</span>
              ${n.budget ? `<span class="tag">₹${n.budget}</span>` : ""}
            </div>
            <div>
              ${n.image ? `<img src="${n.image}" class="thumb" style="display:block;">`
                        : `<div class="small">No image</div>`}
            </div>
          `;
          this.needsList.appendChild(li);
        });
      }
    }

    new NeedApp();
  </script>

</body>
  </html>
