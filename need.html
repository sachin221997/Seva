<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Post Need – Seva App</title>

<style>
    :root{
        --bg:#F0FDF4;
        --card:#ffffff;
        --accent:#22C55E;
        --accent-dark:#15803D;
        --muted:#666;
        --radius:12px;
        font-family: Inter, system-ui, Arial;
    }

    body{
        margin:0;
        background:var(--bg);
        color:#111;
    }

    /* HEADER */
    .header {
        background: var(--accent-dark);
        color: white;
        padding: 15px 20px;
        display: flex;
        align-items: center;
        border-bottom-left-radius: 18px;
        border-bottom-right-radius: 18px;
    }

    .back-btn {
        background: white;
        color: var(--accent-dark);
        padding: 7px 16px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 15px;
    }

    .title {
        flex: 1;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        margin-right: 45px;
    }

    /* PAGE BODY */
    .container{
        max-width:900px;
        margin:20px auto;
        padding:20px;
    }

    .card{
        background:white;
        padding:24px;
        border-radius:var(--radius);
        box-shadow:0 6px 18px rgba(0,0,0,0.06);
        margin-bottom:20px;
    }

    label{
        font-weight:600;
        display:block;
        margin-bottom:6px;
        color:#15803D;
    }

    input, select, textarea{
        width:100%;
        padding:12px;
        border-radius:10px;
        border:1px solid #ccc;
        margin-bottom:16px;
        font-size:16px;
    }

    textarea{
        height:110px;
        resize:none;
    }

    .btn-submit{
        width:100%;
        padding:14px;
        background:var(--accent);
        color:white;
        border:none;
        border-radius:10px;
        font-size:18px;
        font-weight:700;
        cursor:pointer;
    }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <a href="javascript:history.back()" class="back-btn">← Back</a>
    <div class="title">Post Need</div>
</div>

<div class="container">

    <div class="card">
        <h2 style="color:#15803D; margin-top:0;">Create a Job Request</h2>
        <p>Fill the details below and nearby workers will see your need instantly.</p>
    </div>

    <div class="card">
        <label>Work Category</label>
        <select id="category">
            <option value="">Select Category</option>
            <option>Massage Service</option>
            <option>Car Wash</option>
            <option>House Cleaning</option>
            <option>Delivery / Loading</option>
            <option>Labour Help</option>
            <option>Electrician</option>
            <option>Plumber</option>
            <option>Home Cook</option>
            <option>Personal Help</option>
            <option>Other Work</option>
        </select>

        <label>Amount You Will Pay (₹)</label>
        <input type="number" id="amount" placeholder="E.g., 200 / 300 / 500">

        <label>Work Description</label>
        <textarea id="description" placeholder="Explain what work is needed..."></textarea>

        <label>Your Address</label>
        <textarea id="address" placeholder="Full address where worker needs to come..."></textarea>

        <label>Your City</label>
        <input type="text" id="city" placeholder="Enter your city">

        <label>Preferred Time</label>
        <input type="text" id="time" placeholder="E.g., Today 3 PM, Tomorrow morning...">

        <label>Your Mobile Number</label>
        <input type="number" id="phone" placeholder="Required to contact you">

        <button class="btn-submit" onclick="submitNeed()">Post Need</button>
    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="firebase.js"></script>

<script>
function submitNeed(){
    const category = document.getElementById("category").value;
    const amount = document.getElementById("amount").value;
    const description = document.getElementById("description").value;
    const address = document.getElementById("address").value;
    const city = document.getElementById("city").value;
    const time = document.getElementById("time").value;
    const phone = document.getElementById("phone").value;

    if(!category || !amount || !description || !address || !city || !time || !phone){
        alert("Please fill all fields");
        return;
    }

    const user = firebase.auth().currentUser;

    firebase.firestore().collection("jobs").add({
        uid: user.uid,
        category,
        amount,
        description,
        address,
        city,
        time,
        phone,
        status: "open",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>{
        alert("Your job has been posted successfully!");
        window.location.href = "customer_dashboard.html";
    });
}
</script>

</body>
  </html>
