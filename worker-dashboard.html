<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Worker Dashboard — Seva</title>
  <style>
    :root{
      --green:#1a8f4a;
      --accent:#0b63c9;
      --muted:#6b7280;
      --card:#fff;
      --bg:#f1faf3;
      font-family: Inter, system-ui, Arial, sans-serif;
    }
    body{ margin:0; background:var(--bg); color:#0f1724; padding:14px; }
    .topbar{
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      background:var(--green); color:#fff; padding:12px 14px;
      border-radius:10px; box-shadow:0 6px 18px rgba(26,143,74,0.12);
    }
    .topbar h1{ margin:0; font-size:16px; }
    .small{ font-size:13px; color:var(--muted); }
    .card{
      background:var(--card); border-radius:12px; padding:12px;
      box-shadow:0 6px 18px rgba(2,6,23,0.06); margin-top:12px;
    }
    .btn{
      background:var(--green); color:#fff; border:0; padding:10px 12px;
      border-radius:10px; cursor:pointer; font-weight:700;
    }
    .btn.secondary{
      background:#f3f4f6; color:#111; border:1px solid #e6eef0;
    }
    .jobs{ margin-top:12px; display:flex; flex-direction:column; gap:12px; }
    .job{
      border-radius:12px; padding:12px; background:#fff;
      box-shadow:0 6px 16px rgba(2,6,23,0.04);
    }
    .job h3{ margin:0 0 6px 0; font-size:16px; }
    .meta{
      display:flex; gap:12px; flex-wrap:wrap; color:var(--muted);
      font-size:13px; margin-bottom:8px;
    }
    .status{
      font-weight:700; padding:6px 8px; border-radius:8px; font-size:13px;
      margin-top:8px;
    }
    .status.open{ background:#fff9e6; color:#b45309; }
    .status.accepted{ background:#e6f8ff; color:#0b63c9; }
    .status.payment_received{ background:#fff0f6; color:#9f1239; }
    .status.fee_pending{ background:#fff4e6; color:#b45309; }
    .status.completed{ background:#e6fff1; color:#0a5f3b; }
    .actions{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
    @media(max-width:520px){
      .topbar{ flex-direction:column; gap:8px; align-items:flex-start; }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div>
      <h1>Seva — Worker Dashboard</h1>
      <div class="small" id="workerName">Hello, Worker</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn secondary" onclick="goHome()">Home</button>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="card" id="locationCard">
    <strong>Nearby Jobs</strong>
    <div class="small" id="locStatus">Requesting location…</div>
  </div>

  <div id="jobsContainer" class="jobs"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
  // ✔ YOUR FIREBASE CONFIG (added)
  var firebaseConfig = {
      apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
      authDomain: "seva-6f191.firebaseapp.com",
      projectId: "seva-6f191",
      storageBucket: "seva-6f191.firebasestorage.app",
      messagingSenderId: "826093348416",
      appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
      measurementId: "G-78H32SRPCD"
  };
  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();
  const rdb = firebase.database();

  const ADMIN_UPI = "sachiny4561@oksbi";
  const PLATFORM_FEE = 50;

  const jobsContainer = document.getElementById("jobsContainer");
  const workerNameEl = document.getElementById("workerName");
  const locStatus = document.getElementById("locStatus");

  let workerUid = null;
  let workerProfile = null;
  let workerLat = null;
  let workerLng = null;

  // Auth check
  auth.onAuthStateChanged(async user => {
    if (!user) return location = "login.html";
    workerUid = user.uid;

    const snap = await rdb.ref("users/"+workerUid).once("value");
    workerProfile = snap.val() || {};
    workerNameEl.innerText = "Hello, " + (workerProfile.name || "Worker");

    getLocationAndLoadJobs();
  });

  function goHome(){ location = "home.html"; }

  // Get geolocation
  function getLocationAndLoadJobs(){
    if (!navigator.geolocation){
      locStatus.innerText = "Geolocation not supported.";
      loadJobs();
      return;
    }
    navigator.geolocation.getCurrentPosition(pos=>{
      workerLat = pos.coords.latitude;
      workerLng = pos.coords.longitude;
      locStatus.innerText = "Location found.";
      loadJobs();
    }, err=>{
      locStatus.innerText = "Location denied.";
      loadJobs();
    });
  }

  // Load nearby jobs
  async function loadJobs(){
    jobsContainer.innerHTML = "<div class='small'>Loading jobs…</div>";

    const q = db.collection("jobs").where("status","==","open").orderBy("createdAt","desc");
    const snap = await q.get();

    const list = [];
    snap.forEach(doc=>{
      const j = doc.data();
      j.id = doc.id;
      list.push(j);
    });

    // No distance filter simple for now
    renderJobs(list);
  }

  function renderJobs(list){
    jobsContainer.innerHTML = "";
    if (!list.length){
      jobsContainer.innerHTML = "<div class='small'>No jobs found nearby.</div>";
      return;
    }

    list.forEach(job=>{
      const box = document.createElement("div");
      box.className = "job";
      box.innerHTML = `
        <h3>${job.title || job.type}</h3>
        <div class="meta">
          <div>₹${job.amount}</div>
          <div>${job.duration || ""}</div>
          <div>${job.location || ""}</div>
        </div>
        <div class="small">${job.description || ""}</div>

        <div class="status open">OPEN</div>

        <div class="actions">
          <button class="btn" onclick="acceptJob('${job.id}')">Accept Job</button>
        </div>
      `;
      jobsContainer.appendChild(box);
    });
  }

  // Accept job
  async function acceptJob(id){
    if (!confirm("Accept this job?")) return;

    await db.collection("jobs").doc(id).update({
      status:"accepted",
      workerId: workerUid,
      workerName: workerProfile.name || "",
      acceptedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("Job Accepted!");
    location = "worker_dashboard.html?tab=accepted";
  }

  // Extra listener for accepted jobs
  setTimeout(()=>{
    listenAcceptedJobs();
  },1200);

  function listenAcceptedJobs(){
    db.collection("jobs")
      .where("workerId","==",workerUid)
      .where("status","in",["accepted","payment_received","fee_pending"])
      .onSnapshot(snap=>{
        const old = document.getElementById("acceptedSection");
        if (old) old.remove();

        const card = document.createElement("div");
        card.id = "acceptedSection";
        card.className = "card";
        card.innerHTML = "<strong>Your Active Jobs</strong>";

        snap.forEach(doc=>{
          const j = doc.data();
          j.id = doc.id;

          const box = document.createElement("div");
          box.className = "job";

          let statusHTML = `<div class="status ${j.status}">${j.status.toUpperCase()}</div>`;
          let actionsHTML = renderAcceptedActions(j);

          box.innerHTML = `
            <h3>${j.title || j.type}</h3>
            <div class="meta">
              <div>Amount: ₹${j.amount}</div>
              <div>Worker Share: ₹${(j.amount - PLATFORM_FEE)}</div>
            </div>
            ${statusHTML}
            <div class="actions">${actionsHTML}</div>
          `;

          card.appendChild(box);
        });

        document.body.insertBefore(card, jobsContainer);
      });
  }

  function renderAcceptedActions(j){
    if (j.status === "accepted"){
      return `
        <button class="btn" onclick="markPaymentReceived('${j.id}')">Payment Received</button>
      `;
    }
    if (j.status === "payment_received"){
      return `
        <button class="btn" onclick="openPayPlatform('${j.id}')">Pay Platform Fee ₹${PLATFORM_FEE}</button>
        <button class="btn secondary" onclick="confirmPlatformPaid('${j.id}')">I Have Paid</button>
      `;
    }
    if (j.status === "fee_pending"){
      return `<div class="small">Waiting for admin fee confirmation…</div>`;
    }
    return `<div class="small">No actions</div>`;
  }

  async function markPaymentReceived(id){
    await db.collection("jobs").doc(id).update({
      status:"payment_received"
    });
    alert("Status updated!");
  }

  function openPayPlatform(id){
    const url = `upi://pay?pa=${ADMIN_UPI}&am=${PLATFORM_FEE}&pn=Seva%20Platform`;
    location.href = url;
  }

  async function confirmPlatformPaid(id){
    await db.collection("jobs").doc(id).update({
      status:"completed",
      completedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await rdb.ref("admin/earnings").transaction(v => (v || 0) + PLATFORM_FEE);

    alert("Job Completed!");
  }

  function logout(){
    auth.signOut().then(()=> location="login.html");
  }

  </script>

</body>
</html>
