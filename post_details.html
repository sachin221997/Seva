<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Post Details – Seva</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    button {
      padding: 10px 20px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 6px;
      background: black;
      color: white;
      border: none;
    }
    .box {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .meta {
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <h2>📌 Post Details</h2>
  <div id="content">Loading...</div>

<script>
  // ----------------------------------------
  // 🔥 YOUR REAL FIREBASE CONFIG
  // ----------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  // ----------------------------------------
  // GET postId from URL
  // ----------------------------------------
  function getParam(name) {
    const url = new URL(window.location.href);
    return url.searchParams.get(name);
  }

  const postId = getParam("postId");
  const content = document.getElementById("content");

  if (!postId) {
    content.innerHTML = "<p>Invalid post.</p>";
  }

  // ----------------------------------------
  // AUTH CHECK
  // ----------------------------------------
  auth.onAuthStateChanged(user => {
    if (!user) {
      content.innerHTML = "<p>Please login to view this post.</p>";
      return;
    }
    loadPost();
  });

  // ----------------------------------------
  // LOAD POST DETAILS
  // ----------------------------------------
  function loadPost() {
    db.collection("posts").doc(postId).onSnapshot(doc => {
      if (!doc.exists) {
        content.innerHTML = "<p>Post not found.</p>";
        return;
      }

      const d = doc.data();

      let html = `
        <div class="box">
          <p><b>Message:</b> ${d.text || "<i>Voice-only request</i>"}</p>
          <p class="meta"><b>Status:</b> ${d.status}</p>
          <p class="meta"><b>Posted:</b> ${new Date(d.timestamp?.toDate()).toLocaleString()}</p>
      `;

      if (d.voiceUrl) {
        html += `
          <p><b>Voice Message:</b></p>
          <audio controls src="${d.voiceUrl}" style="width:100%"></audio>
        `;
      }

      html += `
        <br>
        <div id="actions"></div>
        </div>
      `;

      content.innerHTML = html;

      // Show Accept button if job still open
      const actions = document.getElementById("actions");

      if (d.status === "open") {
        actions.innerHTML = `
          <button onclick="acceptJob()">Accept Job</button>
        `;
      } else if (d.status === "assigned") {
        actions.innerHTML = `
          <p><b>Assigned to:</b> ${d.acceptedBy}</p>
        `;
      }
    });
  }

  // ----------------------------------------
  // ACCEPT JOB
  // ----------------------------------------
  async function acceptJob() {
    const user = auth.currentUser;

    if (!user) {
      alert("Please login first.");
      return;
    }

    const postRef = db.collection("posts").doc(postId);

    try {
      await db.runTransaction(async (t) => {
        const snap = await t.get(postRef);

        if (!snap.exists) throw "Post not found";

        const data = snap.data();
        if (data.status !== "open") throw "Already assigned";

        t.update(postRef, {
          status: "assigned",
          acceptedBy: user.uid,
          assignedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });

      // Notify the customer
      await db.collection("notifications").add({
        type: "assigned",
        postId: postId,
        from: auth.currentUser.uid,
        to: (await db.collection("posts").doc(postId).get()).data().userId,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        seen: false
      });

      alert("Job accepted successfully!");
      window.location.href = "worker-dashboard.html";

    } catch (err) {
      alert("Error: " + err);
    }
  }

</script>

</body>
</html>
