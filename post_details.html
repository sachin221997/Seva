<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Post Details — Seva</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family: Arial, sans-serif;padding:16px;max-width:800px;margin:auto;}
    button{padding:10px 14px;margin:8px 0}
    .meta{color:#666;font-size:13px}
  </style>
</head>
<body>
  <div id="container"></div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "PASTE_API_KEY",
      authDomain: "PASTE_AUTH_DOMAIN",
      projectId: "PASTE_PROJECT_ID",
      storageBucket: "PASTE_STORAGE_BUCKET",
      messagingSenderId: "PASTE_MSG_SENDER",
      appId: "PASTE_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function getQueryParam(name){
      const url = new URL(location.href);
      return url.searchParams.get(name);
    }

    auth.onAuthStateChanged(user => {
      if (!user) {
        document.getElementById('container').innerHTML = '<p>Please login to view this post.</p>';
        return;
      }
      loadPost(user);
    });

    async function loadPost(user) {
      const postId = getQueryParam('postId');
      if (!postId) {
        document.getElementById('container').innerHTML = '<p>Missing postId.</p>';
        return;
      }
      const docRef = db.collection('posts').doc(postId);

      // listen real-time to the post
      docRef.onSnapshot(doc => {
        if (!doc.exists) {
          document.getElementById('container').innerHTML = '<p>Post not found.</p>';
          return;
        }
        const data = doc.data();
        render(data, postId, user);
      });
    }

    async function render(data, postId, user) {
      const container = document.getElementById('container');
      container.innerHTML = `
        <h2>Request Details</h2>
        <div><strong>Text:</strong> ${data.text || '<i>Voice only</i>'}</div>
        <div class="meta">Status: ${data.status}</div>
        <div class="meta">Posted: ${new Date(data.timestamp?.toDate?.() || Date.now()).toLocaleString()}</div>
        <div id="voiceArea"></div>
        <div id="actions"></div>
      `;
      if (data.voiceUrl) {
        const a = document.getElementById('voiceArea');
        a.innerHTML = '<p><strong>Voice:</strong></p>';
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = data.voiceUrl;
        a.appendChild(audio);
      }

      const actions = document.getElementById('actions');
      actions.innerHTML = '';

      if (data.status === 'open') {
        const btn = document.createElement('button');
        btn.textContent = 'Accept Job';
        btn.onclick = () => acceptJob(postId, user.uid, data.userId);
        actions.appendChild(btn);
      } else if (data.status === 'assigned') {
        actions.innerHTML += `<p>Assigned to: ${data.acceptedBy}</p>`;
        // if assigned to this user, show contact info link or next steps
        if (data.acceptedBy === user.uid) {
          actions.innerHTML += '<p>You accepted this job — contact the customer via profile page.</p>';
        }
      } else {
        actions.innerHTML += `<p>Status: ${data.status}</p>`;
      }
    }

    // Accept job: atomic update with transaction
    async function acceptJob(postId, workerUid, customerUid) {
      const docRef = db.collection('posts').doc(postId);
      try {
        await db.runTransaction(async (tx) => {
          const doc = await tx.get(docRef);
          if (!doc.exists) throw 'Post removed';
          const status = doc.data().status;
          if (status !== 'open') throw 'Already assigned';
          tx.update(docRef, {
            status: 'assigned',
            acceptedBy: workerUid,
            assignedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });

        // create notification for the customer
        await db.collection('notifications').add({
          type: 'post_assigned',
          postId,
          to: customerUid,
          from: workerUid,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          seen: false
        });

        alert('Job accepted! Customer has been notified.');
        // redirect to worker dashboard if you have one
      } catch (err) {
        console.error(err);
        alert('Unable to accept job: ' + err);
      }
    }

  </script>
</body>
  </html>
