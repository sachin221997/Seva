<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Create Post – Seva</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Firebase SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

  <style>
    body { 
      font-family: Arial; 
      padding: 20px; 
      max-width: 800px; 
      margin: auto; 
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      margin: 8px 4px;
      font-size: 16px;
    }
    #status {
      margin-top: 14px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>Create Request (Text + Voice)</h2>

  <label><b>Your Request:</b></label>
  <textarea id="text" placeholder="Write what you need... Example: I need medicine delivery"></textarea>

  <br><br>

  <!-- Voice Recording Controls -->
  <button id="startRec">🎤 Start Voice</button>
  <button id="stopRec" disabled>⏹ Stop</button>
  <p id="recStatus"></p>

  <br>

  <!-- Create post -->
  <button id="createPost" style="background: black; color: white;">Post Request</button>

  <p id="status"></p>

  <script>
    // -----------------------------------
    // 🔥 YOUR REAL FIREBASE CONFIG
    // -----------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
      authDomain: "seva-6f191.firebaseapp.com",
      projectId: "seva-6f191",
      storageBucket: "seva-6f191.firebasestorage.app",
      messagingSenderId: "826093348416",
      appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
      measurementId: "G-78H32SRPCD"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // -----------------------------------
    // Voice Recording Setup
    // -----------------------------------
    let mediaRecorder;
    let audioChunks = [];
    let finalVoiceBlob = null;

    const startBtn = document.getElementById("startRec");
    const stopBtn = document.getElementById("stopRec");
    const recStatus = document.getElementById("recStatus");

    startBtn.onclick = async () => {
      audioChunks = [];
      finalVoiceBlob = null;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          finalVoiceBlob = new Blob(audioChunks, { type: "audio/webm" });
          recStatus.innerHTML = "🎤 Voice Recorded (" + Math.round(finalVoiceBlob.size/1024) + " KB)";
        };

        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        recStatus.innerHTML = "Recording...";
      } 
      catch (err) {
        recStatus.innerHTML = "Microphone blocked!";
      }
    };

    stopBtn.onclick = () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };

    // -----------------------------------
    // Create Post
    // -----------------------------------
    document.getElementById("createPost").onclick = async () => {
      document.getElementById("status").innerHTML = "Posting...";

      const user = auth.currentUser;
      if (!user) {
        alert("Please login first");
        return;
      }

      const text = document.getElementById("text").value.trim();

      // Get location
      if (!navigator.geolocation) {
        document.getElementById("status").innerHTML = "Location not supported";
        return;
      }

      navigator.geolocation.getCurrentPosition(async(pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        try {
          // Step 1: Create Firestore post
          const postRef = await db.collection("posts").add({
            userId: user.uid,
            text: text,
            voiceUrl: "",
            lat: lat,
            lng: lng,
            status: "open",
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            acceptedBy: null
          });

          // Step 2: Upload voice if exists
          if (finalVoiceBlob) {
            const path = "voices/" + postRef.id + ".webm";
            const uploadTask = storage.ref(path).put(finalVoiceBlob);

            uploadTask.on("state_changed", null, (e)=>{}, async () => {
              const url = await storage.ref(path).getDownloadURL();
              await postRef.update({ voiceUrl: url });
            });
          }

          document.getElementById("status").innerHTML = "✔ Post Created Successfully!";
          document.getElementById("text").value = "";
          recStatus.innerHTML = "";
          finalVoiceBlob = null;

        } catch (error) {
          console.log(error);
          document.getElementById("status").innerHTML = "❌ Error creating post";
        }

      }, () => {
        document.getElementById("status").innerHTML = "Location permission denied!";
      });

    };
  </script>

</body>
</html>
