<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available Jobs - Seva Worker</title>

<style>
body{
    margin:0;
    font-family:Inter, Arial;
    background:#ecfdf5;
}
.top{
    background:#15803d;
    padding:20px;
    color:white;
    text-align:center;
    font-size:26px;
    font-weight:700;
}
.container{
    max-width:900px;
    margin:20px auto;
    padding:12px;
}
.job-card{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-bottom:16px;
    box-shadow:0 4px 18px rgba(0,0,0,0.1);
}
.title{
    font-size:20px;
    color:#166534;
    font-weight:700;
}
.desc{
    margin:8px 0;
    color:#444;
}
.info{
    font-size:14px;
    margin-top:4px;
}
.money{
    font-size:17px;
    font-weight:700;
    color:#0f5132;
}
.accept-btn{
    margin-top:12px;
    padding:10px 16px;
    background:#15803d;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    font-weight:600;
}
.voice-btn{
    margin-top:8px;
    padding:8px 12px;
    background:#374151;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}
.logout{
    text-align:center;
    margin-top:18px;
}
.logout button{
    background:white;
    color:#15803d;
    border:2px solid #15803d;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}
.no-jobs{
    text-align:center;
    font-weight:700;
    font-size:20px;
    color:#14532d;
    margin-top:40px;
}
</style>
</head>

<body>

<div class="top">Seva • Worker Jobs</div>

<div class="logout">
    <button onclick="logout()">Logout</button>
</div>

<div class="container" id="jobList">
    <p class="no-jobs" id="noJobsMsg" style="display:none;">No jobs available right now</p>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// ---------------------
// Firebase Config
// ---------------------
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const jobList = document.getElementById("jobList");
const noJobsMsg = document.getElementById("noJobsMsg");

// ---------------------
// Check if worker logged in
// ---------------------
auth.onAuthStateChanged(user => {
    if (!user) {
        alert("Please login as worker.");
        window.location.href = "login.html";
        return;
    }

    loadJobs();
});


// ---------------------
// Load available jobs
// ---------------------
function loadJobs(){
    db.collection("jobs")
      .where("status", "==", "pending")
      .orderBy("createdAt", "desc")
      .onSnapshot(snapshot => {

        jobList.innerHTML = "";

        if(snapshot.empty){
            noJobsMsg.style.display = "block";
            return;
        }

        noJobsMsg.style.display = "none";

        snapshot.forEach(doc => {
            const data = doc.data();
            renderJob(doc.id, data);
        });
    });
}


// ---------------------
// Render job card
// ---------------------
function renderJob(id, job){
    const div = document.createElement("div");
    div.className = "job-card";

    div.innerHTML = `
        <div class="title">${job.title}</div>
        <div class="desc">${job.description}</div>

        <div class="info"><b>Type:</b> ${job.type}</div>
        <div class="info"><b>Location:</b> ${job.location}</div>
        <div class="info"><b>Hours:</b> ${job.hours}</div>

        <div class="money">Customer Pays: ₹${job.amount}</div>
        <div class="money">Worker Earns: ₹${job.workerMoney}</div>
        <div class="info">Platform Fee: ₹${job.platformFee}</div>
        
        ${job.voiceUrl ? `<button class="voice-btn" onclick="playVoice('${job.voiceUrl}')">Play Voice Note</button>` : ""}

        <button class="accept-btn" onclick="acceptJob('${id}')">Accept Job</button>
    `;

    jobList.appendChild(div);
}


// ---------------------
// Play Voice Note
// ---------------------
function playVoice(url){
    const audio = new Audio(url);
    audio.play();
}


// ---------------------
// Accept Job
// ---------------------
async function acceptJob(jobId){
    const user = auth.currentUser;

    if (!user) {
        alert("Please login first.");
        return;
    }

    try {
        // Lock job → assign worker
        await db.collection("jobs").doc(jobId).update({
            workerId: user.uid,
            status: "assigned",
            assignedAt: new Date()
        });

        alert("Job accepted! Check your active jobs.");
        window.location.href = "worker_home.html";

    } catch (err){
        alert("Error: " + err.message);
    }
}


// ---------------------
// Logout
// ---------------------
function logout(){
    auth.signOut().then(()=>{
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
