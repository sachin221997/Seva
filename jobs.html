<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jobs – Seva App</title>

  <style>
    :root{
      --bg:#F0FDF4;
      --card:#ffffff;
      --accent:#22C55E;
      --accent-dark:#15803D;
      --muted:#666;
      --radius:12px;
      font-family: Inter, system-ui, Arial;
    }

    body{
      margin:0;
      background:var(--bg);
      color:#111;
    }

    /* =======================
          TOP NAVIGATION
       ======================= */

    .topnav {
      background: var(--accent);
      color: white;
      padding: 14px 20px;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .topnav .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .topnav .links a {
      margin-left: 20px;
      color: white;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      transition: 0.2s;
    }

    .topnav .links a:hover {
      opacity: 0.8;
    }

    @media (max-width: 700px) {
      .topnav {
        flex-direction: column;
        text-align: center;
      }
      .topnav .links {
        margin-top: 8px;
      }
      .topnav .links a {
        display: inline-block;
        margin: 6px 10px;
      }
    }

    /* =======================
          JOBS PAGE UI
       ======================= */

    .container{
      max-width:900px;
      margin:20px auto;
      padding:20px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:var(--radius);
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      margin-bottom:20px;
    }

    h1, h2{
      margin-top:0;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-top:12px;
    }

    input, select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid #ddd;
      font-size:15px;
    }

    ul.jobs{
      list-style:none;
      padding:0;
      display:grid;
      gap:14px;
    }

    li.job{
      background:white;
      padding:16px;
      border-radius:12px;
      box-shadow:0 4px 14px rgba(0,0,0,0.05);
      display:flex;
      gap:14px;
    }

    .meta{flex:1;}

    .meta h3{margin:0 0 6px;}

    .muted{color:#777;font-size:14px;}

    .tag{
      background:#DCFCE7;
      color:#15803D;
      padding:6px 10px;
      border-radius:18px;
      font-size:12px;
      margin-right:6px;
    }

    .thumb{
      width:130px;
      height:95px;
      border-radius:10px;
      object-fit:cover;
      border:1px solid #ddd;
    }
  </style>
</head>

<body>

  <!-- =======================
          TOP NAV BAR
       ======================= -->
  <nav class="topnav">
    <div class="logo">Seva</div>
    <div class="links">
      <a href="index.html">Home</a>
      <a href="need.html">Post Need</a>
      <a href="jobs.html">Jobs</a>
      <a href="help.html">Help</a>
      <a href="about.html">About</a>
    </div>
  </nav>


  <div class="container">

    <div class="card">
      <h1>Available Jobs</h1>
      <p class="muted">Find work posted by people near you and earn daily or per hour.</p>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search title, location, category...">
        <select id="categoryFilter">
          <option value="">All</option>
          <option value="Home Services">Home Services</option>
          <option value="Tutoring">Tutoring</option>
          <option value="Delivery">Delivery</option>
          <option value="Cleaning">Cleaning</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <div class="card">
      <h2>Job Listings</h2>
      <ul id="jobsList" class="jobs"></ul>
    </div>

  </div>


  <script type="module">
    class JobsPage {
      constructor(){
        this.key = "my_app_needs_v1";
        this.list = document.getElementById("jobsList");
        this.searchInput = document.getElementById("searchInput");
        this.categoryFilter = document.getElementById("categoryFilter");

        this.needs = this.load();
        this.bind();
        this.render();
      }

      bind(){
        this.searchInput.addEventListener("input", () => this.render());
        this.categoryFilter.addEventListener("change", () => this.render());
      }

      load(){
        return JSON.parse(localStorage.getItem(this.key) || "[]");
      }

      render(){
        let jobs = [...this.needs];

        const q = this.searchInput.value.toLowerCase();
        const cat = this.categoryFilter.value;

        if(q){
          jobs = jobs.filter(j =>
            j.title.toLowerCase().includes(q) ||
            j.description.toLowerCase().includes(q) ||
            j.location.toLowerCase().includes(q)
          );
        }

        if(cat){
          jobs = jobs.filter(j => j.category === cat);
        }

        this.list.innerHTML = "";

        if(jobs.length === 0){
          this.list.innerHTML = `<li class='muted'>No jobs found.</li>`;
          return;
        }

        jobs.forEach(n => {
          const li = document.createElement("li");
          li.className = "job";

          li.innerHTML = `
            <div class="meta">
              <h3>${n.title}</h3>
              <div class="muted">${n.category} • ${new Date(n.createdAt).toLocaleString()}</div>
              <p>${n.description}</p>
              <div>
                <span class="tag">${n.location}</span>
                ${n.budget ? `<span class="tag">₹${n.budget}</span>` : ""}
              </div>
            </div>

            <div>
              ${
                n.image
                  ? `<img src="${n.image}" class="thumb">`
                  : `<div class="muted" style="width:130px;text-align:center;padding-top:30px;">No Image</div>`
              }
            </div>
          `;

          this.list.appendChild(li);
        });
      }
    }

    new JobsPage();
  </script>

</body>
</html>
