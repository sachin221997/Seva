<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rate Worker - Seva Care</title>

<style>
    body {
        font-family: Arial;
        background: #f1f5ff;
        margin: 0;
        text-align: center;
        padding: 20px;
    }

    h1 {
        color: #4a90e2;
    }

    .card {
        background: white;
        width: 90%;
        margin: 20px auto;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        text-align: left;
    }

    .btn {
        background: #4a90e2;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 18px;
        margin-top: 15px;
        width: 90%;
    }

    select, textarea {
        width: 90%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }
</style>
</head>

<body>

<h1>⭐ Rate Your Worker</h1>

<div id="loading">Loading booking info...</div>

<div id="rateBox" style="display:none;" class="card">
    <h2 id="service"></h2>

    <p><b>Worker:</b> <span id="workerName">Loading...</span></p>

    <label><b>Select Rating (1–5 stars):</b></label><br>
    <select id="rating">
        <option value="5">⭐ 5 - Excellent</option>
        <option value="4">⭐ 4 - Very Good</option>
        <option value="3">⭐ 3 - Good</option>
        <option value="2">⭐ 2 - Poor</option>
        <option value="1">⭐ 1 - Very Bad</option>
    </select><br><br>

    <label><b>Write a Review:</b></label><br>
    <textarea id="reviewText" rows="4" placeholder="Write your experience..."></textarea>

    <button class="btn" onclick="submitReview()">Submit Review</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script src="auth.js"></script>

<script>
// Extract booking ID from URL
const urlParams = new URLSearchParams(window.location.search);
const bookingId = urlParams.get("booking");

if (!bookingId) {
    document.body.innerHTML = "<h2>Invalid link. No booking ID provided.</h2>";
}

// Load booking details
auth.onAuthStateChanged(async user => {
    if (!user) {
        alert("Login required!");
        window.location.href = "login.html";
        return;
    }

    const bookingRef = db.collection("bookings").doc(bookingId);
    const bookingDoc = await bookingRef.get();

    if (!bookingDoc.exists) {
        document.getElementById("loading").innerHTML = "Booking not found!";
        return;
    }

    const b = bookingDoc.data();

    document.getElementById("service").innerText = b.service;
    document.getElementById("loading").style.display = "none";

    // Load worker info
    const workerRef = db.collection("users").doc(b.assignedWorkerId);
    const workerDoc = await workerRef.get();

    if (workerDoc.exists) {
        const w = workerDoc.data();
        document.getElementById("workerName").innerText = w.email;
    }

    document.getElementById("rateBox").style.display = "block";
});


// ----------------------------
// Submit Review
// ----------------------------
async function submitReview() {
    const user = auth.currentUser;
    if (!user) return alert("Login required!");

    const rating = Number(document.getElementById("rating").value);
    const reviewText = document.getElementById("reviewText").value.trim();

    if (reviewText.length < 3) {
        alert("Please write at least 3 characters.");
        return;
    }

    const bookingRef = db.collection("bookings").doc(bookingId);
    const bookingDoc = await bookingRef.get();

    if (!bookingDoc.exists) return alert("Booking not found!");

    const b = bookingDoc.data();

    // Save review in reviews collection
    await db.collection("reviews").add({
        workerId: b.assignedWorkerId,
        bookingId: bookingId,
        userId: auth.currentUser.uid,
        rating: rating,
        reviewText: reviewText,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Update worker rating totals
    await db.collection("users").doc(b.assignedWorkerId).update({
        ratingTotal: firebase.firestore.FieldValue.increment(rating),
        ratingCount: firebase.firestore.FieldValue.increment(1)
    });

    alert("Thank you! Your review has been submitted.");
    window.location.href = "my_bookings.html";
}
</script>

</body>
    </html>
