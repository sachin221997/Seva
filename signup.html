<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seva - Signup</title>

<style>
body { margin:0; font-family:Inter; background:#e8f5e9; }
.header { background:#1b5e20; padding:25px; color:white; text-align:center; font-size:32px; font-weight:700; }
.card { width:90%; max-width:380px; margin:40px auto; background:white; padding:25px; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,0.15); text-align:center; }
.card h2 { color:#1b5e20; margin-bottom:12px;}
input { width:90%; padding:12px; margin:10px 0; border:1px solid #aaa; border-radius:8px; font-size:16px; }
.btn { width:95%; padding:12px; background:#2e7d32; color:white; border:none; border-radius:8px; font-size:18px; cursor:pointer; }
.link { color:#2e7d32; margin-top:10px; display:block; }
.footer { padding:25px; text-align:center; background:#1b5e20; color:white; margin-top:40px; }
</style>

</head>

<body>

<div class="header">❤️ Seva Care</div>

<div class="card">
    <h2>Create Account</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button class="btn" onclick="signup()">Create Account</button>

    <a class="link" href="login.html">Already have an account? Login</a>
</div>

<div class="footer">© 2025 Seva – Spreading Care ❤️</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function signup(){
    let email = document.getElementById("email").value;
    let pass  = document.getElementById("password").value;

    firebase.auth().createUserWithEmailAndPassword(email, pass)
    .then(user=>{
        db.collection("users").doc(user.user.uid).set({
            email: email,
            role: "customer",
            earnings: 0,
            available: true,
            createdAt: new Date()
        });
        alert("Account Created!");
        window.location.href = "login.html";
    })
    .catch(err=>alert(err.message));
}
</script>
</body>
</html>
