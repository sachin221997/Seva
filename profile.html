<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seva - My Profile</title>

<style>
body {
  margin:0;
  font-family: Inter, Arial;
  background:#e8f5e9;
}

.top {
  background:#15803d;
  color:white;
  padding:20px;
  font-size:24px;
  font-weight:700;
  text-align:center;
}

.container {
  max-width:400px;
  margin:20px auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 14px rgba(0,0,0,0.15);
  text-align:center;
}

.profile-img {
  width:140px;
  height:140px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #15803d;
  margin-bottom:12px;
}

.upload-btn {
  margin-top:10px;
  padding:10px 14px;
  background:#15803d;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.logout-btn{
  margin-top:20px;
  padding:10px 14px;
  background:#d32f2f;
  color:white;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}
</style>
</head>

<body>

<div class="top">My Profile</div>

<div class="container" id="profileBox">

  <img id="profilePic" class="profile-img" src="https://via.placeholder.com/140" />

  <br>

  <input type="file" id="fileInput" accept="image/*">

  <button class="upload-btn" onclick="uploadPhoto()">Upload Photo</button>

  <h3 id="userEmail"></h3>

  <button class="logout-btn" onclick="logout()">Logout</button>

</div>

<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

<script>
// Firebase Config
var firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
    measurementId: "G-78H32SRPCD"
};
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

const profilePic = document.getElementById("profilePic");
const fileInput = document.getElementById("fileInput");
const userEmail = document.getElementById("userEmail");


// Load user data
auth.onAuthStateChanged(async user=>{
    if(!user){
        window.location.href = "login.html";
        return;
    }

    userEmail.innerText = user.email;

    // Load profile photo from Firestore
    const doc = await db.collection("users").doc(user.uid).get();
    if(doc.exists){
        const data = doc.data();
        if(data.photoURL){
            profilePic.src = data.photoURL;
        }
    }
});


// Upload Profile Photo
async function uploadPhoto(){
    const user = auth.currentUser;
    if(!user){
        alert("Please login.");
        return;
    }

    const file = fileInput.files[0];
    if(!file){
        alert("Select a photo first");
        return;
    }

    const ext = file.name.split('.').pop();
    const path = `profile_photos/${user.uid}.${ext}`;
    const ref = storage.ref().child(path);

    try{
        await ref.put(file);
        const url = await ref.getDownloadURL();

        // Save link in Firestore
        await db.collection("users").doc(user.uid).update({
            photoURL: url
        });

        profilePic.src = url;

        alert("Profile photo updated successfully!");

    } catch(err){
        alert("Error uploading photo: " + err.message);
    }
}


// Logout
function logout(){
    auth.signOut().then(()=>{
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
