<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f2f2f2;
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
    }
    .container {
        max-width: 420px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }
    #uploadBtn, #saveBtn {
        width: 100%;
        padding: 14px;
        background: #0a662e;
        color: white;
        border: none;
        border-radius: 6px;
        margin-top: 15px;
        font-size: 16px;
    }
    #logoutBtn {
        width: 100%;
        padding: 14px;
        background: #d32f2f;
        color: white;
        border: none;
        border-radius: 6px;
        margin-top: 15px;
    }
    #emailDisplay {
        text-align: center;
        font-weight: bold;
        margin-top: 15px;
        font-size: 16px;
    }
</style>
</head>
<body>

<h2>My Profile</h2>

<div class="container">

    <!-- Profile Photo -->
    <input type="file" id="profilePic">
    <button id="uploadBtn">Upload Photo</button>

    <!-- Email -->
    <p id="emailDisplay"></p>

    <!-- UPI ID (worker only) -->
    <input type="text" id="upi" placeholder="Your UPI ID (worker only)" style="display:none;">

    <!-- Mobile Number -->
    <input type="text" id="phone" placeholder="Your Mobile Number">

    <!-- Description -->
    <input type="text" id="description" placeholder="Write something about yourself...">

    <!-- Experience (worker only) -->
    <input type="text" id="experience" placeholder="Experience (e.g., 2 years)" style="display:none;">

    <!-- City / Area -->
    <input type="text" id="city" placeholder="Your City / Area">

    <!-- Job Title (worker only) -->
    <input type="text" id="jobTitle" placeholder="Your Job Title / What you offer" style="display:none;">

    <button id="saveBtn">Save Details</button>
    <button id="logoutBtn">Logout</button>
</div>


<!-- Firebase v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
    // Your Firebase Config
    var firebaseConfig = {
        apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
        authDomain: "seva-6f191.firebaseapp.com",
        projectId: "seva-6f191",
        storageBucket: "seva-6f191.firebasestorage.app",
        messagingSenderId: "826093348416",
        appId: "1:826093348416:web:19fefe43b9b7cba09b21a5",
        measurementId: "G-78H32SRPCD"
    };
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    // Load Profile Data
    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            document.getElementById("emailDisplay").innerText = user.email;

            db.collection("users").doc(user.uid).get().then(doc => {
                let data = doc.data();

                // Basic fields load
                document.getElementById("phone").value = data.phone || "";
                document.getElementById("description").value = data.description || "";
                document.getElementById("city").value = data.city || "";

                // If worker, show extras
                if (data.role === "worker") {
                    document.getElementById("upi").style.display = "block";
                    document.getElementById("experience").style.display = "block";
                    document.getElementById("jobTitle").style.display = "block";

                    document.getElementById("upi").value = data.upi || "";
                    document.getElementById("experience").value = data.experience || "";
                    document.getElementById("jobTitle").value = data.jobTitle || "";
                }
            });
        }
    });

    // Save Details
    document.getElementById("saveBtn").onclick = function () {
        var user = firebase.auth().currentUser;

        db.collection("users").doc(user.uid).get().then(doc => {
            let data = doc.data();

            let updateData = {
                phone: document.getElementById("phone").value,
                description: document.getElementById("description").value,
                city: document.getElementById("city").value
            };

            if (data.role === "worker") {
                updateData.upi = document.getElementById("upi").value;
                updateData.experience = document.getElementById("experience").value;
                updateData.jobTitle = document.getElementById("jobTitle").value;
            }

            db.collection("users").doc(user.uid).update(updateData).then(() => {
                alert("Profile updated successfully!");
            });
        });
    };

    // Logout
    document.getElementById("logoutBtn").onclick = function () {
        firebase.auth().signOut().then(() => {
            window.location.href = "login.html";
        });
    };
</script>

</body>
</html>
