<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile - Seva Care</title>

  <style>
    body {
      font-family: Arial;
      background: #f1f5ff;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #4a90e2; }

    .card {
      background: white;
      width: 90%;
      margin: 15px auto;
      padding: 20px;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, select {
      width: 95%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .btn {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      width: 90%;
      margin-top: 15px;
      font-size: 16px;
    }

    #logoutBtn {
      background: #d9534f;
      color: white;
      padding: 10px 20px;
      border: none;
      margin-bottom: 20px;
      border-radius: 8px;
    }

    .onlineBtn { background: green; }
    .offlineBtn { background: #d9534f; }
  </style>
</head>

<body>

<button id="logoutBtn">Logout</button>

<h1>My Profile</h1>
<p id="email">Loading...</p>

<div class="card">
  <h2>Personal Info</h2>

  <label>Name:</label>
  <input id="name" placeholder="Enter your name">

  <label>Phone:</label>
  <input id="phone" placeholder="Enter phone number">

  <label>Gender:</label>
  <select id="gender">
    <option value="">Select</option>
    <option value="Male">Male</option>
    <option value="Female">Female</option>
    <option value="Other">Other</option>
  </select>

  <label>Address:</label>
  <input id="address" placeholder="Enter address">

  <button class="btn" onclick="saveProfile()">Save Profile</button>
</div>

<!-- WORKER SECTION -->
<div id="workerSection" class="card" style="display:none;">
  <h2>Worker Info</h2>

  <p><b>Your Rating:</b> <span id="rating">Loading...</span></p>
  <p><b>Your Earnings:</b> ₹ <span id="workerEarnings">0</span></p>

  <h3>Availability</h3>
  <button class="btn onlineBtn" onclick="setOnline()">Go Online</button>
  <button class="btn offlineBtn" onclick="setOffline()">Go Offline</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    getDoc, 
    updateDoc 
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyBOcsJLpaNSVcFo-Xl6UFEtItcoyxRFzik",
    authDomain: "seva-6f191.firebaseapp.com",
    projectId: "seva-6f191",
    storageBucket: "seva-6f191.firebasestorage.app",
    messagingSenderId: "826093348416",
    appId: "1:826093348416:web:19fefe43b9b7cba09b21a5"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // 🚨 Redirect to login if NOT logged in
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }

    // Display email
    document.getElementById("email").innerText = "Logged in as: " + user.email;

    // Load user data
    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);

    if (!snap.exists()) return;

    const data = snap.data();

    // Fill profile
    document.getElementById("name").value = data.name || "";
    document.getElementById("phone").value = data.phone || "";
    document.getElementById("gender").value = data.gender || "";
    document.getElementById("address").value = data.address || "";

    // If worker, show worker section
    if (data.role === "worker") {
      document.getElementById("workerSection").style.display = "block";
      document.getElementById("workerEarnings").innerText = data.earnings || 0;

      let ratingText = "No Ratings Yet";
      if (data.ratingCount > 0) {
        ratingText = (data.ratingTotal / data.ratingCount).toFixed(1) + " ⭐";
      }
      document.getElementById("rating").innerText = ratingText;
    }
  });

  // ⭐ Save Profile
  window.saveProfile = async function() {
    const user = auth.currentUser;
    if (!user) return;

    await updateDoc(doc(db, "users", user.uid), {
      name: document.getElementById("name").value,
      phone: document.getElementById("phone").value,
      gender: document.getElementById("gender").value,
      address: document.getElementById("address").value
    });

    alert("Profile Updated Successfully!");
  }

  // ⭐ Worker Online
  window.setOnline = async function() {
    const user = auth.currentUser;
    await updateDoc(doc(db, "users", user.uid), { available: true });
    alert("You are now ONLINE");
  }

  // ⭐ Worker Offline
  window.setOffline = async function() {
    const user = auth.currentUser;
    await updateDoc(doc(db, "users", user.uid), { available: false });
    alert("You are now OFFLINE");
  }

  // ⭐ Logout
  logoutBtn.addEventListener("click", () => {
    signOut(auth).then(() => {
      alert("Logged out!");
      window.location.href = "login.html";
    });
  });
</script>

</body>
    </html>
