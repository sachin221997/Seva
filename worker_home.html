<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Worker Dashboard - Seva Care</title>

    <style>
        body {
            font-family: Arial;
            background: #f1f5ff;
            text-align: center;
            padding: 20px;
        }

        h1 { color: #4a90e2; }

        .card {
            background: white;
            width: 85%;
            margin: 15px auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 12px rgba(0,0,0,0.1);
        }

        button {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            margin-top: 10px;
            width: 80%;
            font-size: 18px;
        }

        #logoutBtn { background: #d9534f; }
    </style>
</head>

<body>

    <h1>Worker Dashboard</h1>
    <p id="workerEmail">Loading...</p>

    <!-- WORKER STATUS -->
    <div class="card">
        <h2>Your Status</h2>
        <p>You are logged in as <b>Worker</b>.</p>
    </div>

    <!-- UPCOMING JOBS -->
    <div class="card">
        <h2>Upcoming Jobs</h2>
        <div id="jobsList">No jobs assigned yet.</div>
    </div>

    <!-- EARNINGS -->
    <div class="card">
        <h2>Your Earnings</h2>
        <p id="earningAmount">₹0</p>
    </div>

    <button id="logoutBtn" onclick="logout()">Logout</button>

    <!-- Firebase v10 SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

    <!-- Your JS -->
    <script src="auth.js"></script>

    <script>
        // Load Worker Data
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("workerEmail").innerText = "Logged in as: " + user.email;

            // Load JOBS assigned to worker
            db.collection("bookings")
                .where("assignedWorkerId", "==", user.uid)
                .where("status", "in", ["assigned", "in_progress"])
                .onSnapshot(async (snapshot) => {

                    const jobsList = document.getElementById("jobsList");

                    if (snapshot.empty) {
                        jobsList.innerHTML = "No jobs assigned yet.";
                        return;
                    }

                    jobsList.innerHTML = "";

                    snapshot.forEach((doc) => {
                        const d = doc.data();

                        jobsList.innerHTML += `
                            <div style="background:#fff;padding:15px;margin:10px;border-radius:12px;box-shadow:0px 0px 10px rgba(0,0,0,0.1);">
                                <b>Service:</b> ${d.service}<br>
                                <b>Customer Email:</b> ${d.userEmail}<br>
                                <b>Status:</b> ${d.status}<br><br>

                                ${
                                    d.status === "assigned" 
                                    ? `<button onclick="startJob('${doc.id}')">Start Job</button>`
                                    : `<button onclick="completeJob('${doc.id}')">Complete Job</button>`
                                }
                            </div>
                        `;
                    });
                });

            // Load Earnings
            const docRef = await db.collection("users").doc(user.uid).get();
            if (docRef.exists) {
                const data = docRef.data();
                document.getElementById("earningAmount").innerText = "₹" + (data.earnings || 0);
            }
        });
    </script>

</body>
</html>
